name: 🍎 构建 iOS App (iOS 16.2 专属稳定兼容版)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: '发布版本号 (例如: 1.2.0)'
        required: true
        default: '1.2.0'
        type: string

jobs:
  build:
    name: Build iOS 16.2 Unsigned IPA
    # 使用与 Xcode / iOS SDK 匹配的 Apple Silicon arm64 runner
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      EXPO_NO_TELEMETRY: "1"
      RELEASE_VERSION: ${{ github.event.inputs.release_version || '1.2.0' }}

    steps:
      - name: 🏗️ 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史以便计算 git commit 数量作为 versionCode

      - name: 🍎 校验 Xcode 与编译环境
        run: |
          echo "=== Xcode 版本信息 ==="
          xcodebuild -version
          echo "=== Swift 编译器版本 ==="
          swift --version
          echo "=== 可用 SDK 列表 ==="
          xcodebuild -showsdks
          echo "=== 目标部署架构: iOS 16.0 ~ 16.2 (针对 iPadOS 16.2 深度优化) ==="

      - name: 🟢 配置 Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📥 安装依赖
        env:
          LEFTHOOK: "0"
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🩹 修复 ExpoOrpheus 在 iOS 16 SDK 下的编译与配置
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");

          // 1. 修复 PhotoPickerHelper.swift 兼容性
          const photoPickerPath = "packages/orpheus/ios/PhotoPickerHelper.swift";
          const photoPickerDir = path.dirname(photoPickerPath);
          if (!fs.existsSync(photoPickerDir)) {
            fs.mkdirSync(photoPickerDir, { recursive: true });
          }
          const photoPickerContent = [
            'import UIKit',
            'import PhotosUI',
            '',
            'public class PhotoPickerHelper: NSObject, UIImagePickerControllerDelegate, UINavigationControllerDelegate, PHPickerViewControllerDelegate {',
            '    public static let shared = PhotoPickerHelper()',
            '    private var completion: ((String?) -> Void)?',
            '',
            '    public func pickPhoto(completion: @escaping (String?) -> Void) {',
            '        self.completion = completion',
            '        DispatchQueue.main.async {',
            '            guard let topVC = UIApplication.shared.windows.first(where: { $0.isKeyWindow })?.rootViewController else {',
            '                completion(nil)',
            '                return',
            '            }',
            '            if #available(iOS 14, *) {',
            '                var config = PHPickerConfiguration()',
            '                config.selectionLimit = 1',
            '                config.filter = .images',
            '                let picker = PHPickerViewController(configuration: config)',
            '                picker.delegate = self',
            '                topVC.present(picker, animated: true)',
            '            } else {',
            '                let picker = UIImagePickerController()',
            '                picker.sourceType = .photoLibrary',
            '                picker.delegate = self',
            '                topVC.present(picker, animated: true)',
            '            }',
            '        }',
            '    }',
            '',
            '    public func picker(_ picker: PHPickerViewController, didFinishPicking results: [PHPickerResult]) {',
            '        picker.dismiss(animated: true)',
            '        guard let itemProvider = results.first?.itemProvider, itemProvider.canLoadObject(ofClass: UIImage.self) else {',
            '            self.completion?(nil)',
            '            return',
            '        }',
            '        itemProvider.loadObject(ofClass: UIImage.self) { [weak self] image, error in',
            '            guard let image = image as? UIImage, let data = image.jpegData(compressionQuality: 0.85) else {',
            '                self?.completion?(nil)',
            '                return',
            '            }',
            '            let tempDir = NSTemporaryDirectory()',
            '            let filePath = (tempDir as NSString).appendingPathComponent(UUID().uuidString + ".jpg")',
            '            do {',
            '                try data.write(to: URL(fileURLWithPath: filePath))',
            '                self?.completion?(filePath)',
            '            } catch {',
            '                self?.completion?(nil)',
            '            }',
            '        }',
            '    }',
            '',
            '    public func imagePickerController(_ picker: UIImagePickerController, didFinishPickingMediaWithInfo info: [UIImagePickerController.InfoKey : Any]) {',
            '        picker.dismiss(animated: true)',
            '        guard let image = info[.originalImage] as? UIImage, let data = image.jpegData(compressionQuality: 0.85) else {',
            '            self.completion?(nil)',
            '            return',
            '        }',
            '        let tempDir = NSTemporaryDirectory()',
            '        let filePath = (tempDir as NSString).appendingPathComponent(UUID().uuidString + ".jpg")',
            '        do {',
            '            try data.write(to: URL(fileURLWithPath: filePath))',
            '            self.completion?(filePath)',
            '        } catch {',
            '            self.completion?(nil)',
            '        }',
            '    }',
            '',
            '    public func imagePickerControllerDidCancel(_ picker: UIImagePickerController) {',
            '        picker.dismiss(animated: true)',
            '        self.completion?(nil)',
            '    }',
            '}'
          ].join('\\n');
          fs.writeFileSync(photoPickerPath, photoPickerContent, "utf8");
          console.log("✅ 已成功注入 PhotoPickerHelper.swift");

          // 2. 修复 BootSplashVideoView.tsx 在 iOS 端的兼容回退
          const bootSplashPath = "packages/native/src/BootSplashVideoView.tsx";
          if (fs.existsSync(bootSplashPath)) {
            let bsContent = fs.readFileSync(bootSplashPath, "utf8");
            if (!bsContent.includes("Platform.OS === 'ios'")) {
              bsContent = [
                "import React from 'react';",
                "import { View, StyleSheet, Platform } from 'react-native';",
                "import { requireNativeViewManager } from 'expo-modules-core';",
                "",
                "const NativeView = Platform.OS === 'android' ? requireNativeViewManager('BootSplashVideoView') : View;",
                "",
                "export default function BootSplashVideoView(props: any) {",
                "  if (Platform.OS === 'ios') {",
                "    return <View style={[styles.container, props.style]} />;",
                "  }",
                "  return <NativeView {...props} style={[styles.container, props.style]} />;",
                "}",
                "",
                "const styles = StyleSheet.create({",
                "  container: {",
                "    flex: 1,",
                "    backgroundColor: '#000000',",
                "  },",
                "});"
              ].join('\n');
              fs.writeFileSync(bootSplashPath, bsContent, "utf8");
              console.log("✅ 已优化 BootSplashVideoView.tsx 的 iOS 回退逻辑");
            }
          }

          // 3. 锁定 ExpoOrpheus.podspec 部署目标为 iOS 16.0
          const podspecPath = "packages/orpheus/ios/ExpoOrpheus.podspec";
          if (fs.existsSync(podspecPath)) {
            let podspec = fs.readFileSync(podspecPath, "utf8");
            podspec = podspec.replace(/s\.platform\s*=\s*:ios,\s*['"][0-9.]+['"]/, "s.platform = :ios, '16.0'");
            fs.writeFileSync(podspecPath, podspec, "utf8");
            console.log("✅ 已锁定 ExpoOrpheus.podspec 部署基线为 16.0");
          }
          EOF

