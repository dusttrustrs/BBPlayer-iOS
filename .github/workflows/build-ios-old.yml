            modForPhoto = modForPhoto.replace("View(BootSplashVideoView.self) {", photoFuncCode + "\n\n        View(BootSplashVideoView.self) {");
            fs.writeFileSync(modulePath, modForPhoto, "utf8");
            console.log("✅ 已在 ExpoOrpheusModule.swift 中注入原生相册选择器 pickPhotoFromLibrary");
          }
                    // 锁定 ExpoOrpheus.podspec 部署目标为 iOS 16.0
          const podspecPath = "packages/orpheus/ios/ExpoOrpheus.podspec";
          if (fs.existsSync(podspecPath)) {
            let podspec = fs.readFileSync(podspecPath, "utf8");
            podspec = podspec.replace(/s\.platform\s*=\s*:ios,\s*['"][0-9.]+['"]/, "s.platform = :ios, '16.0'");
            fs.writeFileSync(podspecPath, podspec, "utf8");
            console.log("✅ 已锁定 ExpoOrpheus.podspec 部署基线为 16.0");
          }
