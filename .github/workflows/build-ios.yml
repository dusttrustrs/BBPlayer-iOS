      - name: 🩹 iOS 15.0+ 原生 Podspec 与依赖兼容性修补
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");

          // 1. 降级 React Native helpers.rb 中的 min_ios_version_supported (15.1 -> 15.0)
          function walkFiles(dir, predicate, out = []) {
            if (!fs.existsSync(dir)) return out;
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              if (entry.name === ".git" || entry.name === "build" || entry.name === "Pods") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walkFiles(full, predicate, out);
              } else if (entry.isFile() && predicate(entry.name, full)) {
                out.push(full);
              }
            }
            return out;
          }

          const helperFiles = walkFiles("node_modules", (name, full) => name === "helpers.rb" && full.includes("react-native/scripts/cocoapods"));
          let helperPatched = 0;
          for (const f of helperFiles) {
            const orig = fs.readFileSync(f, "utf8");
            const next = orig.replace(/return\s+['"]15\.[1-9]\d*['"]/g, "return '15.0'");
            if (next !== orig) {
              fs.writeFileSync(f, next, "utf8");
              helperPatched++;
            }
          }
          console.log(`✅ 已修补 ${helperPatched} 个 react-native helpers.rb -> min_ios_version_supported = '15.0'`);

          // 2. 统一将 node_modules 与 packages 下所有 .podspec 中的 iOS 最低版本 (> 15.0) 降级至 15.0
          const podspecs = [
            ...walkFiles("node_modules", (name) => name.endsWith(".podspec")),
            ...walkFiles("packages", (name) => name.endsWith(".podspec")),
          ];
          const VER_GT_15 = "(?:15\\.[1-9]\\d*|1[6-9]\\.\\d+|2\\d\\.\\d+)";
          const reColonIos = new RegExp(`(:ios\\s*=>\\s*['"])${VER_GT_15}(['"])`, "g");
          const reHashIos = new RegExp(`(\\bios\\s*:\\s*['"])${VER_GT_15}(['"])`, "g");
          const reDeployTarget = new RegExp(`(ios\\.deployment_target\\s*=\\s*['"])${VER_GT_15}(['"])`, "g");
          const rePlatformIos = new RegExp(`(platform\\s*(?:=\\s*)?:ios\\s*,\\s*['"])${VER_GT_15}(['"])`, "g");
          const reMinIosLine = new RegExp(`(min_supported_ios_version\\s*=[^\\n]*?)['"]${VER_GT_15}['"]`, "g");
          let podspecPatched = 0;
          for (const f of podspecs) {
            const orig = fs.readFileSync(f, "utf8");
            let next = orig
              .replace(reColonIos, "$115.0$2")
              .replace(reHashIos, "$115.0$2")
              .replace(reDeployTarget, "$115.0$2")
              .replace(rePlatformIos, "$115.0$2");
            if (next.includes("min_supported_ios_version")) {
              next = next.replace(/^.*min_supported_ios_version.*$/gm, (line) =>
                line.replace(new RegExp(`(['"])${VER_GT_15}(['"])`, "g"), "$115.0$2")
              );
            }
            if (next !== orig) {
              fs.writeFileSync(f, next, "utf8");
              podspecPatched++;
            }
          }
          console.log(`✅ 已降级 ${podspecPatched} 个 .podspec 的 iOS 平台基线至 15.0`);

          // 3. 修补 ExpoAppMetrics AttributeValidation.swift 中的 iOS 16+ Swift Regex API
          const attrFiles = walkFiles("node_modules", (name, full) =>
            name === "AttributeValidation.swift" && full.includes("expo-app-metrics")
          );
          let attrPatched = 0;
          for (const f of attrFiles) {
            let code = fs.readFileSync(f, "utf8");
            const next = code
              .replace(
                /nonisolated\(unsafe\)\s+private\s+let\s+reservedAttributePatterns:\s*\[Regex<Substring>\]\s*=\s*\[[\s\S]*?\]/,
                [
                  "private func isReservedAttributeKey(_ key: String) -> Bool {",
                  '  (key.hasPrefix("expo.") && key.count > 5) || key == "session.id" || key == "event.name"',
                  "}",
                ].join("\n")
              )
              .replace(
                /if\s+reservedAttributePatterns\.contains\(where:\s*\{\s*trimmedKey\.wholeMatch\(of:\s*\$0\)\s*!=\s*nil\s*\}\)\s*\{/,
                "if isReservedAttributeKey(trimmedKey) {"
              );
            if (next !== code) {
              fs.writeFileSync(f, next, "utf8");
              attrPatched++;
            }
          }
          console.log(`✅ 已修补 ${attrPatched} 个 AttributeValidation.swift (移除 iOS 16+ Regex 依赖)`);

          // 4. 修补 ExpoModulesCore Convertibles+Color.swift 中的 iOS 16+ RegexBuilder / wholeMatch API
          const colorFiles = walkFiles("node_modules", (name, full) =>
            name === "Convertibles+Color.swift" && full.includes("expo-modules-core")
          );
          const ios15CssRegexBlock = [
            'private let cssNumberPattern = "[+-]?\\\\d*\\\\.?\\\\d+"',
            'private let cssNumberOrPercentPattern = "[+-]?\\\\d*\\\\.?\\\\d+%?"',
            'private let commaSepPattern = "\\\\s*,\\\\s*"',
            "",
            "nonisolated(unsafe) private let rgbCommaRegex = try! NSRegularExpression(",
            '  pattern: "^rgba?\\\\(\\\\s*(\\(cssNumberOrPercentPattern))\\(commaSepPattern)(\\(cssNumberOrPercentPattern))\\(commaSepPattern)(\\(cssNumberOrPercentPattern))(?:\\(commaSepPattern)(\\(cssNumberOrPercentPattern)))?\\\\s*\\\\)$",',
            "  options: [.caseInsensitive]",
            ")",
            "",
            "nonisolated(unsafe) private let rgbSpaceRegex = try! NSRegularExpression(",
            '  pattern: "^rgba?\\\\(\\\\s*(\\(cssNumberOrPercentPattern))\\\\s+(\\(cssNumberOrPercentPattern))\\\\s+(\\(cssNumberOrPercentPattern))(?:\\\\s*/\\\\s*(\\(cssNumberOrPercentPattern)))?\\\\s*\\\\)$",',
            "  options: [.caseInsensitive]",
            ")",
            "",
            "nonisolated(unsafe) private let hslCommaRegex = try! NSRegularExpression(",
            '  pattern: "^hsla?\\\\(\\\\s*(\\(cssNumberPattern))\\(commaSepPattern)(\\(cssNumberPattern))%\\(commaSepPattern)(\\(cssNumberPattern))%\\\\s*(?:,\\\\s*(\\(cssNumberOrPercentPattern)))?\\\\s*\\\\)$",',
            "  options: [.caseInsensitive]",
            ")",
            "",
            "nonisolated(unsafe) private let hslSpaceRegex = try! NSRegularExpression(",
            '  pattern: "^hsla?\\\\(\\\\s*(\\(cssNumberPattern))\\\\s+(\\(cssNumberPattern))%\\\\s+(\\(cssNumberPattern))%\\\\s*(?:/\\\\s*(\\(cssNumberOrPercentPattern)))?\\\\s*\\\\)$",',
            "  options: [.caseInsensitive]",
            ")",
            "",
            "nonisolated(unsafe) private let hwbRegex = try! NSRegularExpression(",
            '  pattern: "^hwb\\\\(\\\\s*(\\(cssNumberPattern))\\\\s+(\\(cssNumberPattern))%\\\\s+(\\(cssNumberPattern))%\\\\s*(?:/\\\\s*(\\(cssNumberOrPercentPattern)))?\\\\s*\\\\)$",',
            "  options: [.caseInsensitive]",
            ")",
            "",
            "private func matchCssColor(_ string: String, regex: NSRegularExpression) -> (Substring, Substring, Substring, Substring?)? {",
            "  let nsRange = NSRange(string.startIndex..<string.endIndex, in: string)",
            "  guard let match = regex.firstMatch(in: string, options: [], range: nsRange),",
            "        let r1 = Range(match.range(at: 1), in: string),",
            "        let r2 = Range(match.range(at: 2), in: string),",
            "        let r3 = Range(match.range(at: 3), in: string) else {",
            "    return nil",
            "  }",
            "  let g4: Substring? = match.numberOfRanges > 4 ? Range(match.range(at: 4), in: string).map { string[$0] } : nil",
            "  return (string[r1], string[r2], string[r3], g4)",
            "}",
          ].join("\n");
          const ios15ColorParsers = [
            "private func colorFromRGBString(_ rgbString: String) throws -> UIColor {",
            "  if let match = matchCssColor(rgbString, regex: rgbCommaRegex) ?? matchCssColor(rgbString, regex: rgbSpaceRegex) {",
            "    let r = parseRgbComponent(match.0)",
            "    let g = parseRgbComponent(match.1)",
            "    let b = parseRgbComponent(match.2)",
            "    let a = parseCssAlpha(match.3)",
            "    return UIColor(red: r, green: g, blue: b, alpha: a)",
            "  }",
            "  throw InvalidRGBColorException(rgbString)",
            "}",
            "",
            "private func colorFromHSLString(_ hslString: String) throws -> UIColor {",
            "  if let match = matchCssColor(hslString, regex: hslCommaRegex) ?? matchCssColor(hslString, regex: hslSpaceRegex) {",
            "    let h = CGFloat(Double(match.0) ?? 0)",
            "    let s = CGFloat(min(max((Double(match.1) ?? 0) / 100.0, 0), 1))",
            "    let l = CGFloat(min(max((Double(match.2) ?? 0) / 100.0, 0), 1))",
            "    let a = parseCssAlpha(match.3)",
            "    return hslToUIColor(h: h, s: s, l: l, a: a)",
            "  }",
            "  throw InvalidHSLColorException(hslString)",
            "}",
            "",
            "private func colorFromHWBString(_ hwbString: String) throws -> UIColor {",
            "  if let match = matchCssColor(hwbString, regex: hwbRegex) {",
            "    let h = CGFloat(Double(match.0) ?? 0)",
            "    let w = CGFloat((Double(match.1) ?? 0) / 100.0)",
            "    let b = CGFloat((Double(match.2) ?? 0) / 100.0)",
            "    let a = parseCssAlpha(match.3)",
            "    return hwbToUIColor(h: h, w: w, b: b, a: a)",
            "  }",
            "  throw InvalidHWBColorException(hwbString)",
            "}",
          ].join("\n");
          let colorPatched = 0;
          for (const f of colorFiles) {
            let code = fs.readFileSync(f, "utf8");
            if (!code.includes("import RegexBuilder")) continue;
            let next = code
              .replace("import RegexBuilder", "import Foundation")
              .replace(
                /nonisolated\(unsafe\)\s+private\s+let\s+cssNumber\s*=\s*Regex\s*\{[\s\S]*?\}\.ignoresCase\(\)\s*(?=\n\/\/ MARK: - CSS Color Function Parsers)/,
                ios15CssRegexBlock + "\n"
              )
              .replace(
                /private\s+func\s+colorFromRGBString\(_ rgbString: String\)[\s\S]*?throw InvalidHWBColorException\(hwbString\)\n\}/,
                ios15ColorParsers
              );
            if (next.includes("import RegexBuilder") || next.includes("wholeMatch(of:")) {
              throw new Error(`Convertibles+Color.swift 修补不完整: ${f}`);
            }
            fs.writeFileSync(f, next, "utf8");
            colorPatched++;
          }
          console.log(`✅ 已修补 ${colorPatched} 个 Convertibles+Color.swift (移除 iOS 16+ RegexBuilder 依赖)`);

          // 5. 修补 ExpoModulesCore SceneGeometry.swift 中的 iOS 16+ effectiveGeometry API
          const sceneGeoFiles = walkFiles("node_modules", (name, full) =>
            name === "SceneGeometry.swift" && full.includes("expo-modules-core")
          );
          let sceneGeoPatched = 0;
          for (const f of sceneGeoFiles) {
            const code = fs.readFileSync(f, "utf8");
            if (code.includes("if #available(iOS 16.0, *)")) continue;
            const next = code.replace(
              "return windowScene(for: view)?.effectiveGeometry.interfaceOrientation ?? .unknown",
              [
                "if #available(iOS 16.0, *) {",
                "      return windowScene(for: view)?.effectiveGeometry.interfaceOrientation ?? .unknown",
                "    }",
                "    return windowScene(for: view)?.interfaceOrientation ?? .unknown",
              ].join("\n")
            );
            if (next !== code) {
              fs.writeFileSync(f, next, "utf8");
              sceneGeoPatched++;
            }
          }
          console.log(`✅ 已修补 ${sceneGeoPatched} 个 SceneGeometry.swift (为 effectiveGeometry 添加 iOS 15.0 兼容回退)`);

          // 6. 修补 ExpoModulesJSI：
          //    (a) 替换 JavaScriptRuntime.swift 中的 Swift 5.7+ Regex 字面量 (/^[a-zA-Z_$][a-zA-Z0-9_$]*$/ + wholeMatch)，
          //        彻底消除对 iOS 16+ 专属 libswift_StringProcessing.dylib 的符号导入；
          //    (b) 为 Package.swift 注入 -dead_strip_dylibs，防止编译器默认强链接未使用的 iOS 16+ dylib
          const jsiRuntimeFiles = walkFiles("node_modules", (name, full) =>
            name === "JavaScriptRuntime.swift" && full.includes("expo-modules-jsi")
          );
          const ios15JsIdentCheck = [
            "    let isValidIdentifier: Bool = {",
            "      var iter = name.unicodeScalars.makeIterator()",
            "      guard let first = iter.next() else { return false }",
            "      let isIdentStart: (UnicodeScalar) -> Bool = { s in",
            "        let v = s.value",
            "        return (v >= 0x41 && v <= 0x5A) || (v >= 0x61 && v <= 0x7A) || v == 0x5F || v == 0x24",
            "      }",
            "      let isIdentContinue: (UnicodeScalar) -> Bool = { s in",
            "        let v = s.value",
            "        return isIdentStart(s) || (v >= 0x30 && v <= 0x39)",
            "      }",
            "      guard isIdentStart(first) else { return false }",
            "      while let next = iter.next() {",
            "        if !isIdentContinue(next) { return false }",
            "      }",
            "      return true",
            "    }()",
            "    if !isValidIdentifier {",
          ].join("\n");
          let jsiRuntimePatched = 0;
          for (const f of jsiRuntimeFiles) {
            const orig = fs.readFileSync(f, "utf8");
            if (!orig.includes("name.wholeMatch(of:")) continue;
            const next = orig.replace(
              "    if name.wholeMatch(of: /^[a-zA-Z_$][a-zA-Z0-9_$]*$/) == nil {",
              ios15JsIdentCheck
            );
            if (next.includes("wholeMatch(of:")) {
              throw new Error(`JavaScriptRuntime.swift 修补不完整: ${f}`);
            }
            fs.writeFileSync(f, next, "utf8");
            jsiRuntimePatched++;
          }
          console.log(`✅ 已修补 ${jsiRuntimePatched} 个 ExpoModulesJSI JavaScriptRuntime.swift (移除 Swift Regex 字面量)`);

          const spmFiles = walkFiles("node_modules", (name, full) =>
            name === "Package.swift" && full.includes("expo-modules-jsi")
          );
          let spmPatched = 0;
          for (const f of spmFiles) {
            const orig = fs.readFileSync(f, "utf8");
            if (!orig.includes("-dead_strip_dylibs")) {
              const next = orig.replace(
                '"-Xlinker", "-undefined", "-Xlinker", "dynamic_lookup",',
                '"-Xlinker", "-undefined", "-Xlinker", "dynamic_lookup",\n          "-Xlinker", "-dead_strip_dylibs",'
              );
              if (next !== orig) {
                fs.writeFileSync(f, next, "utf8");
                spmPatched++;
              }
            }
          }
          console.log(`✅ 已为 ${spmPatched} 个 ExpoModulesJSI Package.swift 注入 -dead_strip_dylibs`);

          // 7. 确认 apps/mobile/package.json 已排除 iOS 16+ 原生模块并强制全量源码编译 (禁用 iOS 16.4 预编译 xcframework)
          const pkgPath = "apps/mobile/package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.expo = pkg.expo || {};
          pkg.expo.autolinking = pkg.expo.autolinking || {};
          pkg.expo.autolinking.ios = pkg.expo.autolinking.ios || {};
          pkg.expo.autolinking.ios.buildFromSource = [".*"];
          const excludes = new Set(Array.isArray(pkg.expo.autolinking.ios.exclude) ? pkg.expo.autolinking.ios.exclude : []);
          for (const mod of [
            "@expo/ui",
            "expo-widgets",
            "expo-glass-effect",
            "expo-symbols",
            "expo-dev-client",
            "expo-dev-launcher",
            "expo-dev-menu",
            "expo-dev-menu-interface",
          ]) {
            excludes.add(mod);
          }
          pkg.expo.autolinking.ios.exclude = Array.from(excludes);
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, "\t") + "\n", "utf8");
          console.log("✅ 已确认 iOS autolinking buildFromSource=['.*'] 与排除列表:", pkg.expo.autolinking.ios.exclude.join(", "));
          EOF

      - name: 📱 生成 iOS 原生工程 (Expo Prebuild - iOS 15.0)
        run: |
          set -o pipefail
          export VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Calculated VERSION_CODE=$VERSION_CODE"
          cd apps/mobile
          # 必须带 --no-install，确保在配置 iOS 15.0 Podfile 与 $RNFirebaseDisableSPM 之后再统一执行 pod install
          npx expo prebuild --platform ios --clean --no-install 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"
          # 锁定 MARKETING_VERSION、IPHONEOS_DEPLOYMENT_TARGET=15.0、Podfile.properties.json 与 Podfile
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          let releaseVersion = (process.env.RELEASE_VERSION || "").trim().replace(/^v/i, "").split("-")[0];
          if (!/^\d+\.\d+\.\d+$/.test(releaseVersion)) {
            releaseVersion = "1.2.3";
          }
          const iosRoot = path.resolve("ios");
          const walk = (dir, result = []) => {
            if (!fs.existsSync(dir)) return result;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (["Pods", "build"].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, result);
              else result.push(full);
            }
            return result;
          };
          const projectFiles = walk(iosRoot).filter((file) => file.endsWith(".pbxproj"));
          let projectCount = 0;
          for (const projectPath of projectFiles) {
            let project = fs.readFileSync(projectPath, "utf8");
            let updated = project.replace(/MARKETING_VERSION\s*=\s*[^;]+;/g, `MARKETING_VERSION = ${releaseVersion};`);
            // 统一锁定所有 Target 部署基线为 15.0，适配 iOS 15.0+ 设备
            updated = updated.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[^;]+;/g, `IPHONEOS_DEPLOYMENT_TARGET = 15.0;`);
            if (updated !== project) {
              fs.writeFileSync(projectPath, updated, "utf8");
              projectCount++;
            }
          }
          if (projectFiles.length === 0) throw new Error("Expo prebuild 后未找到 iOS .pbxproj");
          console.log(`✅ 已锁定 iOS MARKETING_VERSION=${releaseVersion} 与 IPHONEOS_DEPLOYMENT_TARGET=15.0（更新 ${projectCount} 个工程）`);

          // 更新 Podfile.properties.json
          const podPropsPath = path.join(iosRoot, "Podfile.properties.json");
          const podProps = fs.existsSync(podPropsPath) ? JSON.parse(fs.readFileSync(podPropsPath, "utf8")) : {};
          podProps["ios.deploymentTarget"] = "15.0";
          fs.writeFileSync(podPropsPath, JSON.stringify(podProps, null, 2) + "\n", "utf8");
          console.log("✅ 已设置 Podfile.properties.json ios.deploymentTarget = 15.0");

          // 更新 Podfile：平台固定为 15.0，禁用预编译模块与 Firebase SPM，并在 post_install 中强制所有 Pods Target 为 15.0
          const podfilePath = path.join(iosRoot, "Podfile");
          if (fs.existsSync(podfilePath)) {
            let podfile = fs.readFileSync(podfilePath, "utf8");
            podfile = podfile.replace(/ENV\[['"]EXPO_USE_PRECOMPILED_MODULES['"]\]\s*=\s*['"]1['"]/g, "ENV['EXPO_USE_PRECOMPILED_MODULES'] = '0'");
            if (!podfile.includes("EXPO_USE_PRECOMPILED_MODULES")) {
              podfile = "ENV['EXPO_USE_PRECOMPILED_MODULES'] = '0'\n" + podfile;
            }
            if (!podfile.includes("RNFirebaseDisableSPM")) {
              podfile = "$RNFirebaseDisableSPM = true\n" + podfile;
            }
            podfile = podfile.replace(/^platform\s+:ios,.*$/m, "platform :ios, '15.0'");
            const enforceIos15Snippet = [
              "    installer.pods_project.build_configurations.each do |config|",
              "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'",
              "    end",
              "    installer.pods_project.targets.each do |target|",
              "      target.build_configurations.each do |config|",
              "        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'",
              "      end",
              "    end",
            ].join("\n");
            if (!podfile.includes("IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'")) {
              if (podfile.includes("post_install do |installer|")) {
                podfile = podfile.replace(
                  "post_install do |installer|",
                  "post_install do |installer|\n" + enforceIos15Snippet
                );
              } else {
                podfile += `\npost_install do |installer|\n${enforceIos15Snippet}\nend\n`;
              }
            }
            fs.writeFileSync(podfilePath, podfile, "utf8");
            console.log("✅ 已将 Podfile 平台锁定为 iOS 15.0 并注入 post_install 部署基线强锁");
          }
          EOF
          # 关键修复：确保 Info.plist 中 100% 写入 UIAppFonts、NSAppTransportSecurity、UIBackgroundModes 与 UIApplicationSceneManifest
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          function findPlist(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findPlist(full);
                if (found) return found;
              } else if (f.name === "Info.plist") {
                return full;
              }
            }
            return null;
          }
          const plistPath = findPlist("ios") || findPlist("apps/mobile/ios");
          if (plistPath) {
            console.log("🔍 检查生成的 Info.plist:", plistPath);
            let content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("NSAppTransportSecurity")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 NSAppTransportSecurity (NSAllowsArbitraryLoads=true)");
            }
            if (!content.includes("MaterialDesignIcons.ttf")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string MaterialDesignIcons.ttf" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIAppFonts (MaterialDesignIcons.ttf)");
            }
            if (!content.includes("audio")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIBackgroundModes (audio 后台播放)");
            }
            content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("UIApplicationSceneManifest")) {
              const sceneManifestXml = "\t<key>UIApplicationSceneManifest</key>\n\t<dict>\n\t\t<key>UIApplicationSupportsMultipleScenes</key>\n\t\t<false/>\n\t\t<key>UISceneConfigurations</key>\n\t\t<dict>\n\t\t\t<key>UIWindowSceneSessionRoleApplication</key>\n\t\t\t<array>\n\t\t\t\t<dict>\n\t\t\t\t\t<key>UISceneConfigurationName</key>\n\t\t\t\t\t<string>Default Configuration</string>\n\t\t\t\t\t<key>UISceneDelegateClassName</key>\n\t\t\t\t\t<string>EXExpoAppSceneDelegate</string>\n\t\t\t\t</dict>\n\t\t\t</array>\n\t\t</dict>\n\t</dict>\n</dict>\n</plist>";
              content = content.replace(new RegExp("</dict>\\s*</plist>"), sceneManifestXml);
              fs.writeFileSync(plistPath, content, "utf8");
              console.log("✅ Info.plist: 已补齐 UIApplicationSceneManifest 配置 (兼容 iOS 15.0 - iOS 27)");
            }
          }
          function findAppDelegate(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findAppDelegate(full);
                if (found) return found;
              } else if (f.name === "AppDelegate.swift" || f.name === "AppDelegate.mm" || f.name === "AppDelegate.m") {
                return full;
              }
            }
            return null;
          }
          const appDelegatePath = findAppDelegate("ios") || findAppDelegate("apps/mobile/ios");
          if (appDelegatePath) {
            let appDelegate = fs.readFileSync(appDelegatePath, "utf8");
            if (appDelegatePath.endsWith(".swift")) {
              if (appDelegate.includes("class AppDelegate: ExpoAppDelegate {") && !appDelegate.includes("ExpoReactNativeFactoryProvider")) {
                appDelegate = appDelegate.replace("class AppDelegate: ExpoAppDelegate {", "class AppDelegate: ExpoAppDelegate, ExpoReactNativeFactoryProvider {");
                const windowStmt = /^[ \t]*window = UIWindow\(frame: UIScreen\.main\.bounds\)\r?\n/m;
                const startStmt = /^[ \t]*factory\.startReactNative\([^)]*\)\r?\n/m;
                const emptyWrapper = /^[ \t]*#if os\(iOS\) \|\| os\(tvOS\)\r?\n[ \t]*#endif\r?\n/m;
                appDelegate = appDelegate.replace(windowStmt, "").replace(startStmt, "").replace(emptyWrapper, "");
                fs.writeFileSync(appDelegatePath, appDelegate, "utf8");
                console.log("✅ AppDelegate.swift: 已补全 ExpoReactNativeFactoryProvider 协议支持 (UIScene)");
              }
            } else if (appDelegate.includes("self.window.backgroundColor = [UIColor whiteColor];")) {
              appDelegate = appDelegate.replace(
                "self.window.backgroundColor = [UIColor whiteColor];",
                "self.window.backgroundColor = [UIColor systemBackgroundColor];"
              );
              fs.writeFileSync(appDelegatePath, appDelegate, "utf8");
              console.log("✅ AppDelegate: 已将 window.backgroundColor 调整为 systemBackgroundColor");
            }
          }
          // 确保 Expo.plist 彻底禁用 expo-updates 远程轮询与错误恢复队列
          function findExpoPlist(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findExpoPlist(full);
                if (found) return found;
              } else if (f.name === "Expo.plist") {
                return full;
              }
            }
            return null;
          }
          const expoPlistPath = findExpoPlist("ios") || findExpoPlist("apps/mobile/ios");
          if (expoPlistPath) {
            console.log("🔍 检查生成的 Expo.plist:", expoPlistPath);
            try {
              execSync(`/usr/libexec/PlistBuddy -c "Set :EXUpdatesEnabled false" "${expoPlistPath}" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :EXUpdatesEnabled bool false" "${expoPlistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Set :EXUpdatesCheckOnLaunch NEVER" "${expoPlistPath}" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :EXUpdatesCheckOnLaunch string NEVER" "${expoPlistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已配置 Expo.plist (EXUpdatesEnabled=false, EXUpdatesCheckOnLaunch=NEVER)");
            } catch (e) {
              console.log("⚠️ PlistBuddy 处理 Expo.plist 告警:", e.message);
            }
          }
          EOF

      - name: 🍎 安装 CocoaPods 依赖 (iOS 15.0 源码编译)
        env:
          EXPO_USE_SOURCE: '1'
          EXPO_USE_PRECOMPILED_MODULES: '0'
          DISABLE_RNREPO: '1'
        run: |
          set -o pipefail
          export NODE_BINARY=$(command -v node)
          cd apps/mobile/ios
          # 预缓存 Sentry.xcframework，避免 Ruby open-uri 在 GitHub Releases 偶发 504 Gateway Time-out
          SENTRY_CACHE_DIR="$HOME/Library/Caches/sentry-react-native/xcframeworks/9.29.0"
          if [ ! -f "$SENTRY_CACHE_DIR/Sentry.xcframework/Info.plist" ]; then
            echo "📦 预缓存 Sentry.xcframework 9.29.0..."
            mkdir -p "$SENTRY_CACHE_DIR"
            curl -fL --retry 5 --retry-delay 3 -o "$SENTRY_CACHE_DIR/Sentry.xcframework.zip" \
              "https://github.com/getsentry/sentry-cocoa/releases/download/9.29.0/Sentry.xcframework.zip" || true
            if [ -f "$SENTRY_CACHE_DIR/Sentry.xcframework.zip" ]; then
              unzip -q -o "$SENTRY_CACHE_DIR/Sentry.xcframework.zip" -d "$SENTRY_CACHE_DIR" || true
              rm -f "$SENTRY_CACHE_DIR/Sentry.xcframework.zip"
            fi
            if [ -f "$SENTRY_CACHE_DIR/Sentry.xcframework/Info.plist" ]; then
              echo "✅ Sentry.xcframework 预缓存就绪"
            else
              echo "⚠️ Sentry.xcframework 预缓存未完成，后续将由 CocoaPods 自行尝试下载"
            fi
          fi
          # 防御性网络重试：针对 GitHub Releases / CocoaPods 源偶发 504 Gateway Time-out 或连接中断自动重试
          POD_INSTALLED=0
          for attempt in 1 2 3; do
            echo "🍎 尝试执行 pod install (第 $attempt 次)..."
            if pod install --repo-update 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"; then
              POD_INSTALLED=1
              break
            fi
            echo "⚠️ pod install 第 $attempt 次失败，等待 5 秒后重试..."
            sleep 5
          done
          if [ "$POD_INSTALLED" -ne 1 ]; then
            echo "❌ pod install 连续 3 次失败"
            exit 1
          fi
          # 确认未链接 ExpoUI / ExpoWidgets / ExpoGlassEffect / ExpoSymbols
          echo "🔍 校验 Podfile.lock 确认未包含 iOS 16+ 专属 Pod..."
          if grep -E "^\s*-\s*(ExpoUI|ExpoWidgets|ExpoGlassEffect|ExpoSymbols)\b" Podfile.lock; then
            echo "❌ 检测到 iOS 16+ 专属 Pod 仍被链接进 Podfile.lock，请检查 autolinking 排除配置！"
            exit 1
          fi
          echo "✅ Podfile.lock 校验通过：不含 ExpoUI / ExpoWidgets / ExpoGlassEffect / ExpoSymbols"
          # 修复 React-Core-prebuilt 头文件与模块映射 + 强锁 Pods.xcodeproj 部署基线为 15.0 + 中和启动异常崩溃
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");
          const iosDir = process.cwd();
          const podsRoot = path.join(iosDir, "Pods");

          // 双重保险：确保 Pods.xcodeproj 所有 IPHONEOS_DEPLOYMENT_TARGET 均 <= 15.0
          const podsPbxproj = path.join(podsRoot, "Pods.xcodeproj", "project.pbxproj");
          if (fs.existsSync(podsPbxproj)) {
            const orig = fs.readFileSync(podsPbxproj, "utf8");
            const patched = orig.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*(15\.[1-9]\d*|1[6-9]\.\d+|2\d\.\d+);/g, "IPHONEOS_DEPLOYMENT_TARGET = 15.0;");
            if (patched !== orig) {
              fs.writeFileSync(podsPbxproj, patched, "utf8");
              console.log("✅ 已再次锁定 Pods.xcodeproj IPHONEOS_DEPLOYMENT_TARGET = 15.0");
            }
          }

          const prebuiltDir = path.join(podsRoot, "React-Core-prebuilt");
          const xcfwDir = path.join(prebuiltDir, "React.xcframework");
          function copyDirRecursive(srcDir, destDir) {
            let copied = 0;
            if (!fs.existsSync(srcDir)) return copied;
            for (const entry of fs.readdirSync(srcDir, { withFileTypes: true })) {
              const srcPath = path.join(srcDir, entry.name);
              const destPath = path.join(destDir, entry.name);
              if (entry.isDirectory()) {
                copied += copyDirRecursive(srcPath, destPath);
              } else if (entry.isFile() && !fs.existsSync(destPath)) {
                fs.mkdirSync(destDir, { recursive: true });
                fs.copyFileSync(srcPath, destPath);
                copied++;
              }
            }
            return copied;
          }
          function materializeReactHeaders(headersRoot, isFrameworkSlice) {
            if (!fs.existsSync(headersRoot)) return 0;
            let count = 0;
            const subdirs = fs.readdirSync(headersRoot, { withFileTypes: true }).filter((d) => d.isDirectory());
            for (const sub of subdirs) {
              const subPath = path.join(headersRoot, sub.name);
              count += copyDirRecursive(subPath, headersRoot);
            }
            if (isFrameworkSlice) {
              const reactSubdir = path.join(headersRoot, "React");
              if (fs.existsSync(reactSubdir)) {
                count += copyDirRecursive(reactSubdir, headersRoot);
              }
            }
            return count;
          }
          if (fs.existsSync(prebuiltDir)) {
            const rnPkgPath = require.resolve("react-native/package.json", { paths: [iosDir] });
            const rnDir = path.dirname(rnPkgPath);
            const rnVersion = JSON.parse(fs.readFileSync(rnPkgPath, "utf8")).version;
            const replaceScript = path.join(rnDir, "scripts", "replace-rncore-version.js");
            if (fs.existsSync(replaceScript)) {
              console.log(`🔄 预切换 React-Core-prebuilt (${rnVersion}) 至 Release 配置...`);
              execFileSync(
                process.execPath,
                [replaceScript, "-c", "Release", "-r", rnVersion, "-p", podsRoot],
                { cwd: podsRoot, stdio: "inherit" }
              );
            }
            const vfsTemplatePath = path.join(xcfwDir, "React-VFS-template.yaml");
            const vfsPath = path.join(prebuiltDir, "React-VFS.yaml");
            if (fs.existsSync(vfsTemplatePath)) {
              const vfsContent = fs
                .readFileSync(vfsTemplatePath, "utf8")
                .replace(/\$\{ROOT_PATH\}/g, () => xcfwDir);
              fs.writeFileSync(vfsPath, vfsContent, "utf8");
              console.log(`✅ 已同步更新 Release 版 VFS 映射: ${vfsPath}`);
            }
            let materializedCount = materializeReactHeaders(path.join(xcfwDir, "Headers"), false);
            if (fs.existsSync(xcfwDir)) {
              for (const entry of fs.readdirSync(xcfwDir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const sliceHeaders = path.join(xcfwDir, entry.name, "React.framework", "Headers");
                  if (fs.existsSync(sliceHeaders)) {
                    materializedCount += materializeReactHeaders(sliceHeaders, true);
                  }
                }
              }
            }
            console.log(`✅ 已实体化平铺 ${materializedCount} 个 React.xcframework 头文件到物理磁盘`);
            const fwModuleReactRegex = /framework module React \{[\s\S]*?\n\}\s*/g;
            const modulemapPaths = [path.join(xcfwDir, "Modules", "module.modulemap")];
            if (fs.existsSync(xcfwDir)) {
              for (const entry of fs.readdirSync(xcfwDir, { withFileTypes: true })) {
                if (entry.isDirectory()) {
                  const sliceMap = path.join(xcfwDir, entry.name, "React.framework", "Modules", "module.modulemap");
                  if (fs.existsSync(sliceMap)) modulemapPaths.push(sliceMap);
                }
              }
            }
            for (const mmPath of modulemapPaths) {
              if (fs.existsSync(mmPath)) {
                const orig = fs.readFileSync(mmPath, "utf8");
                const patched = orig.replace(fwModuleReactRegex, "");
                if (patched !== orig) {
                  fs.writeFileSync(mmPath, patched, "utf8");
                  console.log(`✅ 已修补 modulemap (移除 framework module React): ${path.relative(podsRoot, mmPath)}`);
                }
              }
            }
            const targetSupportDir = path.join(podsRoot, "Target Support Files");
            const useFwModulemap = path.join(targetSupportDir, "React-Core-prebuilt", "React-use-frameworks.modulemap");
            const hasUseFwModulemap = fs.existsSync(useFwModulemap);
            if (fs.existsSync(vfsPath) && fs.existsSync(targetSupportDir)) {
              const cVfsFlag = `-ivfsoverlay "${vfsPath}"`;
              const swiftVfsFlag = `-I "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -Xcc -ivfsoverlay -Xcc "${vfsPath}" -Xcc -Wno-incomplete-umbrella`;
              const cUseFwFlags = `-isystem "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -fmodule-map-file="\${PODS_ROOT}/Target\\ Support\\ Files/React-Core-prebuilt/React-use-frameworks.modulemap"`;
              const swiftUseFwFlags = `-Xcc -isystem -Xcc "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers" -Xcc -fmodule-map-file="\${PODS_ROOT}/Target\\ Support\\ Files/React-Core-prebuilt/React-use-frameworks.modulemap"`;
              function walkXcconfigs(dir, out = []) {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walkXcconfigs(full, out);
                  else if (entry.isFile() && entry.name.endsWith(".xcconfig")) out.push(full);
                }
                return out;
              }
              let patchedCount = 0;
              for (const xcconfigPath of walkXcconfigs(targetSupportDir)) {
                let content = fs.readFileSync(xcconfigPath, "utf8");
                let changed = false;
                for (const key of ["OTHER_CFLAGS", "OTHER_CPLUSPLUSFLAGS"]) {
                  const re = new RegExp(`^(${key}\\s*=\\s*)(.*)$`, "m");
                  const m = content.match(re);
                  if (m) {
                    let extra = "";
                    if (!m[2].includes("React-VFS.yaml")) extra += ` ${cVfsFlag}`;
                    if (hasUseFwModulemap && !m[2].includes("React-use-frameworks.modulemap")) extra += ` ${cUseFwFlags}`;
                    if (extra) {
                      content = content.replace(re, (_, p, v) => `${p}${v}${extra}`);
                      changed = true;
                    }
                  } else {
                    const extra = `${cVfsFlag}${hasUseFwModulemap ? " " + cUseFwFlags : ""}`;
                    content = content.trimEnd() + `\n${key} = $(inherited) ${extra}\n`;
                    changed = true;
                  }
                }
                const swiftRe = /^(OTHER_SWIFT_FLAGS\s*=\s*)(.*)$/m;
                const sm = content.match(swiftRe);
                if (sm) {
                  let extra = "";
                  if (!sm[2].includes("-I \"${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers\"")) {
                    extra += ` -I "\${PODS_ROOT}/React-Core-prebuilt/React.xcframework/Headers"`;
                  }
                  if (!sm[2].includes("React-VFS.yaml")) extra += ` -Xcc -ivfsoverlay -Xcc "${vfsPath}" -Xcc -Wno-incomplete-umbrella`;
                  if (hasUseFwModulemap && !sm[2].includes("React-use-frameworks.modulemap")) extra += ` ${swiftUseFwFlags}`;
                  if (extra) {
                    content = content.replace(swiftRe, (_, p, v) => `${p}${v}${extra}`);
                    changed = true;
                  }
                } else {
                  const extra = `${swiftVfsFlag}${hasUseFwModulemap ? " " + swiftUseFwFlags : ""}`;
                  content = content.trimEnd() + `\nOTHER_SWIFT_FLAGS = $(inherited) ${extra}\n`;
                  changed = true;
                }
                if (changed) {
                  fs.writeFileSync(xcconfigPath, content, "utf8");
                  patchedCount++;
                }
              }
              console.log(`✅ 已为 ${patchedCount} 个 .xcconfig 补齐 React-VFS.yaml / modulemap / Swift -I 编译参数`);
            }
          }
          // 彻底中和 CocoaPods Pods 中 EXUpdates 的 exception.raise() 与 delegate?.throwException
          function patchExpoUpdatesPods(rootDir) {
            if (!fs.existsSync(rootDir)) return;
            const walk = (dir) => {
              for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, f.name);
                if (f.isDirectory()) {
                  walk(full);
                } else if (f.name === "StartupProcedure.swift") {
                  let code = fs.readFileSync(full, "utf8");
                  if (code.includes("exception.raise()")) {
                    code = code.replace("exception.raise()", "NSLog(\"🚨 [EXUpdates Suppressed Crash] %@: %@\", exception.name.rawValue, exception.reason ?? \"\")");
                    fs.writeFileSync(full, code, "utf8");
                    console.log("✅ 已中和 CocoaPods Pods StartupProcedure.swift 中的 exception.raise():", full);
                  }
                } else if (f.name === "ErrorRecovery.swift") {
                  let code = fs.readFileSync(full, "utf8");
                  if (code.includes("delegate?.throwException(NSException(")) {
                    code = code.replace(
                      "delegate?.throwException(NSException(name: name, reason: reason, userInfo: userInfo))",
                      "NSLog(\"🚨 [EXUpdates ErrorRecovery Suppressed Crash] %@: %@\", name.rawValue, reason ?? \"\")"
                    );
                    fs.writeFileSync(full, code, "utf8");
                    console.log("✅ 已中和 CocoaPods Pods ErrorRecovery.swift 中的 delegate?.throwException:", full);
                  }
                }
              }
            };
            walk(rootDir);
          }
          patchExpoUpdatesPods("Pods");
          patchExpoUpdatesPods("apps/mobile/ios/Pods");
          function patchReactNativeExceptionsPods(rootDir) {
            if (!fs.existsSync(rootDir)) return;
            const walk = (dir) => {
              for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, f.name);
                if (f.isDirectory()) {
                  walk(full);
                } else if (f.name === "RCTAssert.m") {
                  let code = fs.readFileSync(full, "utf8");
                  const throwPattern = /@throw\s+\[\[NSException\s+alloc\]\s+initWithName:name\s+reason:message\s+userInfo:userInfo\];/;
                  if (throwPattern.test(code)) {
                    code = code.replace(throwPattern, 'NSLog(@"🚨 [RCTFatal Suppressed] %@: %@", name, message);');
                    fs.writeFileSync(full, code, "utf8");
                    console.log("✅ 已中和 CocoaPods Pods RCTAssert.m 中的 @throw:", full);
                  }
                } else if (f.name === "RCTExceptionsManager.mm") {
                  let code = fs.readFileSync(full, "utf8");
                  const fatalCall = "RCTFatal([NSError errorWithDomain:RCTErrorDomain code:0 userInfo:errorInfo]);";
                  if (code.includes(fatalCall)) {
                    code = code.replace(fatalCall, 'NSLog(@"🚨 [RCTExceptionsManager Suppressed Fatal] %@", description);');
                    fs.writeFileSync(full, code, "utf8");
                    console.log("✅ 已中和 CocoaPods Pods RCTExceptionsManager.mm 中的 RCTFatal 调用:", full);
                  }
                }
              }
            };
            walk(rootDir);
          }
          patchReactNativeExceptionsPods("Pods");
          patchReactNativeExceptionsPods("apps/mobile/ios/Pods");
          EOF

      - name: 🔨 编译 iOS App (iOS 15.0+, 禁用代码签名)
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true' # 禁用 Sentry 符号表自动上传，防止缺少 Token 报错
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          set -o pipefail
          export NODE_BINARY=$(command -v node)
          cd apps/mobile/ios
          xcodebuild build \
            -workspace BBPlayer.xcworkspace \
            -scheme BBPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            MARKETING_VERSION="$RELEASE_VERSION" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log" || {
              echo "❌ xcodebuild 编译失败，提取关键错误日志如下："
              grep -E "(❌|error:|fatal error:|BUILD FAILED)" "$RUNNER_TEMP/build-ios.log" | tail -n 120 || true
              exit 1
            }

      - name: 📄 上传构建错误日志 (仅失败时触发)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-ios-error-log
          path: ${{ runner.temp }}/build-ios.log
          retention-days: 7

      - name: 🛡️ 校验并修补 iOS 15.0+ Mach-O 二进制与动态库兼容性
        run: |
          set -e
          cd apps/mobile/ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "=== 1. 检查主应用 Info.plist MinimumOSVersion ==="
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$APP_PATH/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$APP_PATH/Info.plist"
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist")
          echo "✅ App MinimumOSVersion = $MIN_OS"

          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          MAIN_BIN="$APP_PATH/$EXEC_NAME"

          check_and_fix_macho() {
            local BIN="$1"
            local LABEL="$2"
            echo "--- 检查 Mach-O: $LABEL ---"
            xcrun vtool -show-build "$BIN"
            local MINOS=$(xcrun vtool -show-build "$BIN" | awk '/minos/{print $2; exit}')
            local SDK=$(xcrun vtool -show-build "$BIN" | awk '/sdk/{print $2; exit}')
            if [ -n "$MINOS" ] && [ "$MINOS" != "15.0" ]; then
              # 若高于 15.0 (如 prebuilt hermesvm.framework 为 15.1)，降级 LC_BUILD_VERSION minos 至 15.0 以防止 iOS 15.0 dyld 拒绝加载
              if awk -v v="$MINOS" 'BEGIN { exit !(v > 15.0) }'; then
                echo "⚠️ $LABEL 当前 minos=$MINOS (> 15.0)，使用 xcrun vtool 降级 LC_BUILD_VERSION 至 15.0 (sdk=$SDK)..."
                xcrun vtool -set-build-version ios 15.0 "${SDK:-18.0}" -replace -output "${BIN}.ios15" "$BIN"
                mv "${BIN}.ios15" "$BIN"
                chmod +x "$BIN"
                echo "✅ 降级后 $LABEL 构建版本："
                xcrun vtool -show-build "$BIN"
              fi
            fi

            echo "📋 $LABEL 检查未使用的 Swift Regex 动态库并弱化零导入依赖..."
            node - "$BIN" "$LABEL" << 'NODE_WEAKEN_EOF'
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const binPath = process.argv[2];
            const label = process.argv[3];
            const targets = ["libswift_StringProcessing", "libswift_RegexParser"];
            const importsOut = execFileSync("xcrun", ["dyld_info", "-imports", binPath], { encoding: "utf8" });
            const buf = fs.readFileSync(binPath);
            if (buf.length < 32 || buf.readUInt32LE(0) !== 0xfeedfacf) {
              process.exit(0);
            }
            const ncmds = buf.readUInt32LE(16);
            let offset = 32;
            let changed = false;
            for (let i = 0; i < ncmds; i++) {
              const cmd = buf.readUInt32LE(offset);
              const cmdsize = buf.readUInt32LE(offset + 4);
              if (cmd === 0x0000000c) { // LC_LOAD_DYLIB
                const nameOff = buf.readUInt32LE(offset + 8);
                let end = offset + nameOff;
                while (end < offset + cmdsize && buf[end] !== 0) end++;
                const dylibName = buf.toString("utf8", offset + nameOff, end);
                const matched = targets.find((t) => dylibName.includes(t));
                if (matched) {
                  // 严格确认没有任何符号实际从该 iOS 16+ 动态库导入
                  const importedSyms = importsOut
                    .split("\n")
                    .filter((line) => line.includes(matched) && !line.trim().startsWith("dyld_info"));
                  if (importedSyms.length > 0) {
                    console.error(`❌ ${label} 实际导入了 ${matched} 符号，无法安全弱化:`, importedSyms.slice(0, 10));
                    process.exit(1);
                  }
                  buf.writeUInt32LE(0x80000018, offset); // LC_LOAD_WEAK_DYLIB
                  console.log(`✅ ${label}: 确认 0 个符号导入，已将未使用的 ${dylibName} 弱化为 LC_LOAD_WEAK_DYLIB`);
                  changed = true;
                }
              }
              offset += cmdsize;
            }
            if (changed) {
              fs.writeFileSync(binPath, buf);
            }
          NODE_WEAKEN_EOF

            echo "📋 $LABEL 强依赖动态库 (LC_LOAD_DYLIB) 校验："
            # 只检查强链接 (LC_LOAD_DYLIB)；弱链接 (LC_LOAD_WEAK_DYLIB) 在 iOS 15 上可安全缺失
            local STRONG_BAD=$(otool -l "$BIN" | awk '
              /cmd LC_LOAD_DYLIB/ { strong=1; next }
              /cmd LC_/ { strong=0; next }
              strong && /name / { print $2 }
            ' | grep -E "((ActivityKit|AppIntents|TipKit|Charts|WidgetKit|WorkoutKit|SensitiveContentAnalysis|Translation|LiveCommunicationKit)\.framework|libswift_StringProcessing|libswift_RegexParser)" || true)
            if [ -n "$STRONG_BAD" ]; then
              echo "❌ 致命错误：$LABEL 存在对 iOS 16+ 系统框架的强链接，iOS 15.0 启动必闪退！"
              echo "$STRONG_BAD"
              exit 1
            fi
          }

          echo "=== 2. 检查主二进制文件 ==="
          check_and_fix_macho "$MAIN_BIN" "Main ($EXEC_NAME)"
          echo "📋 主二进制完整链接列表 (otool -L):"
          otool -L "$MAIN_BIN"

          echo "=== 3. 检查并修补所有内嵌动态 Frameworks / Dylibs ==="
          if [ -d "$APP_PATH/Frameworks" ]; then
            for fw in "$APP_PATH/Frameworks"/*.framework; do
              [ -d "$fw" ] || continue
              FW_PLIST="$fw/Info.plist"
              if [ -f "$FW_PLIST" ]; then
                /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$FW_PLIST" 2>/dev/null || true
                FW_EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$FW_PLIST" 2>/dev/null || basename "$fw" .framework)
              else
                FW_EXEC=$(basename "$fw" .framework)
              fi
              if [ -f "$fw/$FW_EXEC" ]; then
                check_and_fix_macho "$fw/$FW_EXEC" "Framework ($FW_EXEC)"
                echo "📋 Framework ($FW_EXEC) 链接列表 (otool -L):"
                otool -L "$fw/$FW_EXEC"
                if [ "$FW_EXEC" = "ExpoModulesJSI" ]; then
                  echo "🔍 ExpoModulesJSI Swift 运行时导入符号 (dyld_info -imports):"
                  xcrun dyld_info -imports "$fw/$FW_EXEC" | grep -E "libswift|Swift|swift_" || true
                fi
              fi
            done
            for dylib in "$APP_PATH/Frameworks"/*.dylib; do
              [ -f "$dylib" ] || continue
              check_and_fix_macho "$dylib" "Dylib ($(basename "$dylib"))"
            done
          fi
          echo "🎉 iOS 15.0+ Mach-O 二进制与动态库兼容性校验全部通过！"

      - name: 📦 打包为未签名 .ipa (iOS 15.0+)
        run: |
          cd apps/mobile/ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件"
            exit 1
          fi
          echo "✅ 找到 App 路径: $APP_PATH"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          if [ "$BUILT_VERSION" != "$RELEASE_VERSION" ]; then
            echo "❌ App 版本不匹配：期望 $RELEASE_VERSION，实际 $BUILT_VERSION"
            exit 1
          fi
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist")
          if [ "$MIN_OS" != "15.0" ]; then
            echo "❌ MinimumOSVersion 不匹配：期望 15.0，实际 $MIN_OS"
            exit 1
          fi
          echo "✅ 已验证 IPA 应用版本: $BUILT_VERSION (MinimumOSVersion: $MIN_OS)"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y -q BBPlayer-iOS15-unsigned.ipa Payload
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          mv BBPlayer-iOS15-unsigned.ipa "${GITHUB_WORKSPACE}/dist/"

      - name: 🚀 上传 iOS 15+ IPA 产物到 GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BBPlayer-iOS15-Unsigned
          path: dist/BBPlayer-iOS15-unsigned.ipa
          retention-days: 30
