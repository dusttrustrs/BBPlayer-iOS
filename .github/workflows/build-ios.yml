              "          {...panResponder.panHandlers}",
              "        >",
              "          <View style={[styles.trackInactive, { backgroundColor: theme.colors.surfaceVariant }]}>",
              "            <View style={[styles.trackActive, { width: `${progressRatio * 100}%`, backgroundColor: theme.colors.primary }]} />",
              "          </View>",
              "          <View style={[styles.thumb, { left: `${progressRatio * 100}%`, backgroundColor: theme.colors.primary }]} />",
              "        </View>",
              "        <View style={styles.rangeLabels}>",
              "          <Text variant='bodySmall' style={{ color: theme.colors.onSurfaceVariant }}>{MIN_SPEED}x</Text>",
              "          <Text variant='bodySmall' style={{ color: theme.colors.onSurfaceVariant }}>{MAX_SPEED}x</Text>",
              "        </View>",
              "      </Dialog.Content>",
              "      <Dialog.Actions>",
              "        <Button onPress={handleReset}>重置</Button>",
              "        <Button onPress={() => close('PlaybackSpeed')}>关闭</Button>",
              "      </Dialog.Actions>",
              "    </>",
              "  )",
              "}",
              "",
              "const styles = StyleSheet.create({",
              "  headerContainer: { alignItems: 'center', marginBottom: 16 },",
              "  speedDisplay: { fontWeight: 'bold' },",
              "  presetsContainer: { flexDirection: 'row', flexWrap: 'wrap', justifyContent: 'center', gap: 8, marginBottom: 20 },",
              "  presetButton: { paddingHorizontal: 12, paddingVertical: 6, borderRadius: 16 },",
              "  presetText: { fontSize: 13 },",
              "  sliderContainer: { height: 40, justifyContent: 'center', paddingHorizontal: 10 },",
              "  trackInactive: { height: 6, borderRadius: 3, width: '100%', overflow: 'hidden' },",
              "  trackActive: { height: '100%', borderRadius: 3 },",
              "  thumb: { position: 'absolute', top: '50%', width: 20, height: 20, borderRadius: 10, marginTop: -10, shadowColor: '#000', shadowOffset: { width: 0, height: 2 }, shadowOpacity: 0.25, shadowRadius: 3, elevation: 4 },",
              "  rangeLabels: { flexDirection: 'row', justifyContent: 'space-between', paddingHorizontal: 10, marginTop: 4 },",
              "})",
              "",
              "export default PlaybackSpeedModal"
            ].join("\n");
            fs.writeFileSync(speedModalPath, speedModalCode, "utf8");
