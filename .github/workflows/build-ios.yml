              "",
              "// 使用固定纯白背景，同时融入用户主题色，保证纯白对比度与主题色彩协调一致。",
              "export function buildPureWhitePaperColors(customPrimaryColor?: string): MD3Colors {",
              "  const base = buildMaterial3PaperColors('light', customPrimaryColor, false)",
              "  return {",
              "    ...base,",
              "    background: '#FFFFFF',",
              "    surface: '#FFFFFF',",
              "    surfaceVariant: '#FFFFFF',",
              "    elevation: {",
              "      level0: 'transparent',",
              "      level1: '#FFFFFF',",
              "      level2: '#FFFFFF',",
              "      level3: '#FFFFFF',",
              "      level4: '#FFFFFF',",
              "      level5: '#FFFFFF',",
              "    },",
              "  }",
              "}",
              "",
              "export function buildMaterial3PaperColors(",
              "  colorScheme: ColorSchemeName,",
              "  customPrimaryColor?: string,",
              "  adaptiveBackground?: boolean,",
              "): MD3Colors {",
              "  const isDark = colorScheme === 'dark'",
              "  const d = Color.android.dynamic",
              "  const fallback = isDark ? MD3DarkTheme.colors : MD3LightTheme.colors",
              "",
              "  let primary = (d.primary as string) ?? fallback.primary",
              "  let primaryContainer = (d.primaryContainer as string) ?? fallback.primaryContainer",
              "  let onPrimary = (d.onPrimary as string) ?? fallback.onPrimary",
              "  let onPrimaryContainer = (d.onPrimaryContainer as string) ?? fallback.onPrimaryContainer",
              "  let secondary = (d.secondary as string) ?? fallback.secondary",
              "  let secondaryContainer = (d.secondaryContainer as string) ?? fallback.secondaryContainer",
              "  let onSecondaryContainer = (d.onSecondaryContainer as string) ?? fallback.onSecondaryContainer",
              "  let inversePrimary = (d.primaryInverse as string) ?? fallback.inversePrimary",
              "",
