              "    try {",
              "      const c = ColorJS(customPrimaryColor)",
              "      if (isDark) {",
              "        const lum = c.luminosity()",
              "        const tuned = lum < 0.15 ? c.lighten(0.35) : c",
              "        primary = tuned.hex()",
              "        onPrimary = tuned.isDark() ? '#ffffff' : '#000000'",
              "        primaryContainer = c.mix(ColorJS('#000000'), 0.6).hex()",
              "        onPrimaryContainer = c.lighten(0.5).hex()",
              "        secondary = c.mix(ColorJS(fallback.secondary), 0.35).hex()",
              "        secondaryContainer = c.mix(ColorJS('#1d1b20'), 0.75).hex()",
