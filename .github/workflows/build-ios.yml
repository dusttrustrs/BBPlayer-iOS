          fs.writeFileSync("apps/mobile/src/components/navigation/SkinAppbarBackground.tsx", "import MaskedView from '@react-native-masked-view/masked-view'\nimport { Image } from 'expo-image'\nimport { LinearGradient } from 'expo-linear-gradient'\nimport { memo } from 'react'\nimport { StyleSheet, View } from 'react-native'\n\nimport useAppStore from '@/hooks/stores/useAppStore'\nimport useSkinStore from '@/hooks/stores/useSkinStore'\nimport useActiveSkin from '@/hooks/theme/useActiveSkin'\n\nexport const SKIN_APPBAR_FADE_HEIGHT = 56\n\ninterface SkinAppbarBackgroundProps {\n\theight: number\n}\n\nconst SkinAppbarBackground = memo(function SkinAppbarBackground({\n\theight,\n}: SkinAppbarBackgroundProps) {\n\tconst activeSkin = useActiveSkin()\n\tconst activeSkinIndex = useSkinStore((state) => state.activeSkinIndex)\n\tconst pureWhiteBackground = useAppStore(\n\t\t(state) => state.settings.pureWhiteBackground,\n\t)\n\n\tconst head = activeSkin?.skins[activeSkinIndex]?.background.head\n\tif (!head || pureWhiteBackground) return null\n\n\treturn (\n\t\t<View\n\t\t\tpointerEvents='none'\n\t\t\tstyle={[styles.container, { height }]}\n\t\t>\n\t\t\t<MaskedView\n\t\t\t\tstyle={StyleSheet.absoluteFill}\n\t\t\t\tmaskElement={\n\t\t\t\t\t<View style={styles.maskContainer}>\n\t\t\t\t\t\t<View style={styles.maskSolid} />\n\t\t\t\t\t\t<LinearGradient\n\t\t\t\t\t\t\tcolors={['#000000', 'transparent']}\n\t\t\t\t\t\t\tstart={{ x: 0, y: 0 }}\n\t\t\t\t\t\t\tend={{ x: 0, y: 1 }}\n\t\t\t\t\t\t\tstyle={styles.fade}\n\t\t\t\t\t\t/>\n\t\t\t\t\t</View>\n\t\t\t\t}\n\t\t\t>\n\t\t\t\t<Image\n\t\t\t\t\tsource={head}\n\t\t\t\t\tstyle={styles.image}\n\t\t\t\t\tcontentFit='cover'\n\t\t\t\t\tcachePolicy='memory-disk'\n\t\t\t\t/>\n\t\t\t</MaskedView>\n\t\t</View>\n\t)\n})\n\nconst styles = StyleSheet.create({\n\tcontainer: {\n\t\tposition: 'absolute',\n\t\ttop: 0,\n\t\tleft: 0,\n\t\tright: 0,\n\t\toverflow: 'hidden',\n\t},\n\tmaskContainer: {\n\t\tflex: 1,\n\t},\n\tmaskSolid: {\n\t\tflex: 1,\n\t\tb