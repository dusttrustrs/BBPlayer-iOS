nst timer = setTimeout(() => {\n\t\t\tonPlaybackEnd?.()\n\t\t}, 1000)\n\t\treturn () => clearTimeout(timer)\n\t}, [onPlaybackEnd])\n\n\tif (!NativeBootSplashVideoView) {\n\t\treturn (\n\t\t\t<View\n\t\t\t\tstyle={[props.style, { backgroundColor: 'black' }]}\n\t\t\t\ttestID='BootSplashVideoViewFallback'\n\t\t\t/>\n\t\t)\n\t}\n\n\treturn createElement(NativeBootSplashVideoView, {\n\t\t...props,\n\t\t// @ts-expect-error -- native view ref forwarding\n\t\tref: innerRef,\n\t})\n})\n", "utf8");
          fs.writeFileSync("packages/orpheus/ios/PhotoPickerHelper.swift", "import UIKit\nimport PhotosUI\n\n@available(iOS 14.0, *)\npublic final class PhotoPickerHelper: NSObject, PHPickerViewControllerDelegate, UIAdaptivePresentationControllerDelegate {\n    public static let shared = PhotoPickerHelper()\n    private var activeCompletion: ((String?) -> Void)?\n\n    public func pickSingleImage(completion: @escaping (String?) -> Void) {\n        DispatchQueue.main.async {\n            if let prev = self.activeCompletion {\n                self.activeCompletion = nil\n                prev(nil)\n            }\n\n            guard let topVC = Self.topViewController() else {\n                completion(nil)\n                return\n            }\n\n            var config = PHPickerConfiguration()\n            config.filter = .images\n            config.selectionLimit = 1\n            config.preferredAssetRepresentationMode = .compatible\n\n            let picker = PHPickerViewController(configuration: config)\n            picker.delegate = self\n            picker.presentationController?.delegate = self\n\n            self.activeCompletion = completion\n            topVC.present(picker, animated: true)\n        }\n    }\n\n    public func picker(_ picker: PHPickerViewController, didFinishPicking results: [PHPickerResult]) {\n        picker.dismiss(animated: true)\n\n        guard let result = results.first else {\n            finish(with: nil)\n            return\n        }\n\n        let provider = result.itemProvider\n        if provider.canLoadObject(ofClass: UIImage.self) {\n            provider.loadObject(ofClass: UIImage.self) { [weak self] object, _ in\n                guard let self = self, let image = object as? UIImage else {\n                    self?.finish(with: nil)\n                    return\n                }\n                let normalized = Self.normalizeImage(image, maxDimension: 2560)\n                guard let data = normalized.jpegData(compressionQuality: 0.9) else {\n                    self.finish(with: nil)\n                    return\n                }\n                let fileName = \"picked_bg_\\(Int(Date().timeIntervalSince1970 * 1000))_\\(UUID().uuidString.prefix(6)).jpg\"\n                let tempURL = URL(fileURLWithPath: NSTemporaryDirectory()).appendingPathComponent(fileName)\n                do {\n                    try data.write(to: tempURL, options: .atomic)\n                    self.finish(with: tempURL.absoluteString)\n                } catch {\n                    self.finish(with: nil)\n                }\n            }\n        } else {\n            finish(with: nil)\n        }\n    }\n\n    public func presentationControllerDidDismiss(_ presentationController: UIPresentationController) {\n        finish(with: nil)\n    }\n\n    private func finish(with uri: String?) {\n        DispatchQueue.main.async {\n            if let callback = self.activeCompletion {\n                self.activeCompletion = nil\n                callback(uri)\n            }\n        }\n    }\n\n    private static func normalizeImage(_ image: UIImage, maxDimension: CGFloat) -> UIImage {\n        let size = image.size\n        guard size.width > 0, size.height > 0 else { return image }\n        let maxSide = max(size.width, size.height)\n        let scaleFactor = maxSide > maxDimension ? (maxDimension / maxSide) : 1.0\n        let targetSize = CGSize(width: round(size.width * scaleFactor), height: round(size.height * scaleFactor))\n\n        let format = UIGraphicsImageRendererFormat.default()\n        format.scale = 1.0\n        format.opaque = true\n        let renderer = UIGraphicsImageRenderer(size: targetSize, format: format)\n        return renderer.image { _ in\n            image.draw(in: CGRect(origin: .zero, size: targetSize))\n        }\n    }\n\n    private static func topViewController() -> UIViewController? {\n        let scenes = UIApplication.shared.connectedScenes\n            .compactMap { $0 as? UIWindowScene }\n            .filter { $0.activationState == .foregroundActive || $0.activationState == .foregroundInactive }\n\n        let keyWindow = scenes\n            .flatMap { $0.windows }\n            .first { $0.isKeyWindow } ?? scenes.flatMap { $0.windows }.first\n\n        var top = keyWindow?.rootViewController\n        while let presented = top?.presentedViewController, !presented.isBeingDismissed {\n            top = presented\n        }\n        return top\n    }\n}\n", "utf8");
