          const updateSvcPath = "apps/mobile/src/lib/services/updateService.ts";
          if (fs.existsSync(updateSvcPath)) {
            let updateSvcCode = fs.readFileSync(updateSvcPath, "utf8");
            const numericCompareSemver = [
              "export const compareSemver = (a: string, b: string): number => {",
              "    const parse = (value: string): number[] | null => {",
              "        const core = value.trim().replace(/^v/i, '').split(/[+-]/, 1)[0]",
              "        if (!/^\\d+(?:\\.\\d+){0,2}$/.test(core)) return null",
              "        const parts = core.split('.').map(Number)",
              "        if (parts.some((part) => !Number.isSafeInteger(part) || part < 0)) return null",
              "        return [parts[0] ?? 0, parts[1] ?? 0, parts[2] ?? 0]",
              "    }",
              "    const leftParts = parse(a)",
              "    const rightParts = parse(b)",
              "    if (!leftParts || !rightParts) return 0",
              "    for (let i = 0; i < 3; i++) {",
              "        if (leftParts[i] !== rightParts[i]) return leftParts[i] > rightParts[i] ? 1 : -1",
              "    }",
              "    return 0",
              "}",
              "",
            ].join("\n");
            const semverComparePattern = /export const compareSemver = \(a: string, b: string\): number => \{[\s\S]*?\r?\n\}/;
            if (!semverComparePattern.test(updateSvcCode)) {
              throw new Error("未找到 updateService.ts 的 compareSemver 声明，无法修复版本判断逻辑");
            }
            // numericCompareSemver 在声明处已经拼接为字符串，不能再次调用 join。
            updateSvcCode = updateSvcCode.replace(semverComparePattern, numericCompareSemver);
            const newFetchRelease = [
              "export async function fetchLatestRelease(): Promise<Result<ReleaseInfo, Error>> {",
              "    try {",
              "        const res = await Sentry.startSpan(",
              "            { name: 'http:fetch:update-manifest', op: 'http' },",
              "            () =>",
              "                fetch('https://api.github.com/repos/dusttrustrs/BBPlayer-iOS/releases/latest', {",
              "                    cache: 'no-store',",
              "                    headers: {",
              "                        'User-Agent': 'BBPlayer-iOS',",
              "                        'Accept': 'application/vnd.github.v3+json',",
              "                    },",
              "                }),",
              "        )",
              "        if (!res.ok) {",
              "            return err(new Error('获取更新信息失败: ' + res.status + ' ' + res.statusText))",
              "        }",
              "        const data = (await res.json()) as Record<string, unknown>",
              "        const rawTag = typeof data.tag_name === 'string' ? data.tag_name : ''",
              "        const version = normalizeVersion(rawTag.replace(/^v/i, '').split('-')[0])",
              "        if (!version) return err(new Error('GitHub Release 缺少有效的 semver tag'))",
              "        const url =",
              "            typeof data.html_url === 'string'",
              "                ? data.html_url",
              "                : 'https://github.com/dusttrustrs/BBPlayer-iOS/releases/latest'",
              "        const notes = typeof data.body === 'string' ? data.body : ''",
              "        const releaseInfo: ReleaseInfo = {",
              "            version,",
              "            url,",
              "            notes,",
              "            forced: false,",
              "        }",
              "        return ok(releaseInfo)",
              "    } catch (e) {",
              "        return err(toError(e))",
              "    }",
              "}"
            ].join("\n");
            updateSvcCode = updateSvcCode.replace(/export async function fetchLatestRelease\(\): Promise<[\s\S]*?\n\}/, newFetchRelease);
            fs.writeFileSync(updateSvcPath, updateSvcCode, "utf8");
            console.log("✅ 已配置 updateService.ts 指向 GitHub Release API，并启用数字段版本比较");
          }
