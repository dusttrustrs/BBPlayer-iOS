            plist = plist.replace("<string>ExpoWidgetsTarget</string>", "<string>BBPlayer</string>");
            fs.writeFileSync(plistPath, plist, "utf8");
            console.log("✅ 已优化 ExpoWidgetsTarget DisplayName 为 BBPlayer");
          }
