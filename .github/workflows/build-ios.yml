              "    try {",
              "      const seed = ColorJS(customPrimaryColor || '#00897B')",
              "      if (isDark) {",
              "        const darkBase = ColorJS('#0e1011')",
              "        background = seed.mix(darkBase, 0.88).hex()",
              "        surface = seed.mix(ColorJS('#121416'), 0.86).hex()",
              "        surfaceVariant = seed.mix(ColorJS('#222527'), 0.78).hex()",
              "        elevation = {",
              "          level0: 'transparent',",
              "          level1: seed.mix(ColorJS('#16181b'), 0.85).hex(),",
              "          level2: seed.mix(ColorJS('#1a1d20'), 0.83).hex(),",
              "          level3: seed.mix(ColorJS('#1e2125'), 0.81).hex(),",
              "          level4: seed.mix(ColorJS('#212529'), 0.79).hex(),",
              "          level5: seed.mix(ColorJS('#262a2f'), 0.76).hex(),",
              "        }",
              "      } else {",
              "        background = seed.mix(ColorJS('#ffffff'), 0.95).hex()",
              "        surface = seed.mix(ColorJS('#ffffff'), 0.93).hex()",
              "        surfaceVariant = seed.mix(ColorJS('#ffffff'), 0.86).hex()",
              "        elevation = {",
              "          level0: 'transparent',",
              "          level1: seed.mix(ColorJS('#ffffff'), 0.91).hex(),",
              "          level2: seed.mix(ColorJS('#ffffff'), 0.89).hex(),",
              "          level3: seed.mix(ColorJS('#ffffff'), 0.87).hex(),",
              "          level4: seed.mix(ColorJS('#ffffff'), 0.85).hex(),",
              "          level5: seed.mix(ColorJS('#ffffff'), 0.83).hex(),",
              "        }",
              "      }",
              "    } catch {}",
              "  }",
              "",
              "  return {",
              "    primary,",
              "    primaryContainer,",
              "    secondary,",
              "    secondaryContainer,",
              "    tertiary: (d.tertiary as string) ?? fallback.tertiary,",
