          fs.writeFileSync("apps/mobile/src/lib/theme/customBackground.ts", "import { Orpheus } from '@bbplayer/orpheus'\nimport * as DocumentPicker from 'expo-document-picker'\nimport * as FileSystem from 'expo-file-system'\nimport { Platform } from 'react-native'\n\nconst CUSTOM_BG_DIR_NAME = 'custom_backgrounds'\n\nfunction getCustomBgDirectory(): FileSystem.Directory {\n\tconst dir = new FileSystem.Directory(\n\t\tFileSystem.Paths.document,\n\t\tCUSTOM_BG_DIR_NAME,\n\t)\n\tif (!dir.exists) {\n\t\tdir.create({ intermediates: true, idempotent: true })\n\t}\n\treturn dir\n}\n\n/**\n * 唤起系统相册选取单张图片（iOS 使用原生 PHPickerViewController 相册，Android 回退至图片选择器）\n */\nexport async function pickImageFromAlbum(): Promise<string | null> {\n\tconst orpheusAny = Orpheus as unknown as {\n\t\tpickPhotoFromLibrary?: () => Promise<string | null | undefined>\n\t}\n\n\tif (\n\t\tPlatform.OS === 'ios' &&\n\t\ttypeof orpheusAny.pickPhotoFromLibrary === 'function'\n\t) {\n\t\tconst pickedUri = await orpheusAny.pickPhotoFromLibrary()\n\t\treturn pickedUri && pickedUri.trim().length > 0 ? pickedUri : null\n\t}\n\n\tconst result = await DocumentPicker.getDocumentAsync({\n\t\ttype: 'image/*',\n\t\tcopyToCacheDirectory: true,\n\t\tmultiple: false,\n\t})\n\tif (result.canceled || result.assets.length === 0) {\n\t\treturn null\n\t}\n\treturn result.assets[0]?.uri ?? null\n}\n\n/**\n * 将选取的临时图片复制到 Documents/custom_backgrounds 持久化目录，返回相对文件名（避免 iOS 覆盖更新后沙盒 UUID 变更导致失效）\n */\nexport async function saveCustomBackgroundFile(\n\tsourceUri: string,\n\tslot: 'search' | 'library' | 'my' | 'unified',\n): Promise<string> {\n\tconst dir = getCustomBgDirectory()\n\tconst sourceFile = new FileSystem.File(sourceUri)\n\tconst rawExt = sourceUri.split('?')[0]?.split('.').pop()?.toLowerCase()\n\tconst ext =\n\t\trawExt && ['jpg', 'jpeg', 'png', 'webp', 'heic'].includes(rawExt)\n\t\t\t? rawExt\n\t\t\t: 'jpg'\n\tconst fileName = `bg_${slot}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}.${ext}`\n\tconst destFile = new FileSystem.File(dir, fileName)\n\tif (destFile.exists) {\n\t\tdestFile.delete()\n\t}\n\tawait Promise.resolve(sourceFile.copy(destFile))\n\treturn fileName\n}\n\n/**\n * 将存储的文件名解析为当前沙盒下的真实可渲染 file:// URI\n */\nexport function resolveCustomBackgroundUri(\n\tsavedValue?: string | null,\n): string | null {\n\tif (!savedValue || !savedValue.trim()) return null\n\tconst trimmed = savedValue.trim()\n\tif (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {\n\t\treturn trimmed\n\t}\n\tconst fileName = trimmed.split('/').pop()\n\tif (!fileName) return null\n\ttry {\n\t\tconst dir = new FileSystem.Directory(\n\t\t\tFileSystem.Paths.document,\n\t\t\tCUSTOM_BG_DIR_NAME,\n\t\t)\n\t\tconst file = new FileSystem.File(dir, fileName)\n\t\tif (!file.exists) return null\n\t\treturn file.uri\n\t} catch {\n\t\treturn null\n\t}\n}\n\n/**\n * 清理不再被任何主页引用的历史背景图片缓存文件\n */\nexport function cleanupUnusedCustomBackgroundFiles(\n\tactiveValues: Array<string | null | undefined>,\n): void {\n\ttry {\n\t\tconst dir = new FileSystem.Directory(\n\t\t\tFileSystem.Paths.document,\n\t\t\tCUSTOM_BG_DIR_NAME,\n\t\t)\n\t\tif (!dir.exists) return\n\t\tconst keepSet = new Set(\n\t\t\tactiveValues\n\t\t\t\t.filter((v): v is string => Boolean(v && v.trim()))\n\t\t\t\t.map((v) => v.trim().split('/').pop() ?? ''),\n\t\t)\n\t\tconst entries = dir.list()\n\t\tfor (const entry of entries) {\n\t\t\tif (entry instanceof FileSystem.File && !keepSet.has(entry.name)) {\n\t\t\t\ttry {\n\t\t\t\t\tentry.delete()\n\t\t\t\t} catch {\n\t\t\t\t\t// ignore single file cleanup failure\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t} catch {\n\t\t// ignore directory cleanup failure\n\t}\n}\n", "utf8");
          fs.mkdirSync("apps/mobile/src/features/theme", { recursive: true });
          fs.writeFileSync("apps/mobile/src/features/theme/CustomBackgroundModal.tsx", "import { Image } from 'expo-image'\nimport { useEffect, useState } from 'react'\nimport { Pressable, StyleSheet, View } from 'react-native'\nimport { Dialog, Icon, Portal, Text, useTheme } from 'react-native-paper'\n\nimport AnimatedModalOverlay from '@/components/common/AnimatedModalOverlay'\nimport Button from '@/components/common/Button'\nimport UniversalSwitch from '@/components/common/UniversalSwitch'\nimport useAppStore from '@/hooks/stores/useAppStore'\nimport {\n\tcleanupUnusedCustomBackgroundFiles,\n\tpickImageFromAlbum,\n\tsaveCustomBackgroundFile,\n} from '@/lib/theme/customBackground'\nimport toast from '@/utils/toast'\n\ninterface CustomBackgroundModalProps {\n\tvisible: boolean\n\tonDismiss: () => void\n}\n\ntype TabSlot = 'search' | 'library' | 'my'\n\nconst TAB_SLOTS: Array<{ key: TabSlot; label: string }> = [\n\t{ key: 'search', label: '搜索' },\n\t{ key: 'library', label: '音乐库' },\n\t{ key: 'my', label: '我的' },\n]\n\nexport default function CustomBackgroundModal({\n\tvisible,\n\tonDismiss,\n}: CustomBackgroundModalProps) {\n\tconst { colors } = useTheme()\n\tconst settings = useAppStore((state) => state.settings)\n\tconst setSettings = useAppStore((state) => state.setSettings)\n\n\tconst [separateTabs, setSeparateTabs] = useState<boolean>(\n\t\tsettings.customBackgroundSeparateTabs ?? true,\n\t)\n\tconst [pickedSlots, setPickedSlots] = useState<Record<TabSlot, string | null>>(\n\t\t{\n\t\t\tsearch: null,\n\t\t\tlibrary: null,\n\t\t\tmy: null,\n\t\t},\n\t)\n\tconst [pickedUnified, setPickedUnified] = useState<string | null>(null)\n\tconst [saving, setSaving] = useState(false)\n\tconst [picking, setPicking] = useState(false)\n\n\tuseEffect(() => {\n\t\tif (!visible) return\n\t\tsetSeparateTabs(settings.customBackgroundSeparateTabs ?? true)\n\t\tsetPickedSlots({ search: null, library: null, my: null })\n\t\tsetPickedUnified(null)\n\t\tsetSaving(false)\n\t\tsetPicking(false)\n\t}, [visible, settings.customBackgroundSeparateTabs])\n\n\tconst handlePickSlot = async (slot: TabSlot) => {\n\t\tif (picking || saving) return\n\t\tsetPicking(true)\n\t\ttry {\n\t\t\tconst uri = await pickImageFromAlbum()\n\t\t\tif (uri) {\n\t\t\t\tsetPickedSlots((prev) => ({ ...prev, [slot]: uri }))\n\t\t\t}\n\t\t} catch {\n\t\t\ttoast.error('从相册读取图片失败，请重试')\n\t\t} finally {\n\t\t\tsetPicking(false)\n\t\t}\n\t}\n\n\tconst handlePickUnified = async () => {\n\t\tif (picking || saving) return\n\t\tsetPicking(true)\n\t\ttry {\n\t\t\tconst uri = await pickImageFromAlbum()\n\t\t\tif (uri) {\n\t\t\t\tsetPickedUnified(uri)\n\t\t\t}\n\t\t} catch {\n\t\t\ttoast.error('从相册读取图片失败，请重试')\n\t\t} finally {\n\t\t\tsetPicking(false)\n\t\t}\n\t}\n\n\tconst handleConfirm = async () => {\n\t\tif (saving) return\n\n\t\tif (separateTabs) {\n\t\t\tconst hasAnyPicked = Boolean(\n\t\t\t\tpickedSlots.search || pickedSlots.library || pickedSlots.my,\n\t\t\t)\n\t\t\tif (!hasAnyPicked) {\n\t\t\t\ttoast.error('请选择至少一张背景图片')\n\t\t\t\treturn\n\t\t\t}\n\n\t\t\tsetSaving(true)\n\t\t\ttry {\n\t\t\t\tconst nextSearch = pickedSlots.search\n\t\t\t\t\t? await saveCustomBackgroundFile(pickedSlots.search, 'search')\n\t\t\t\t\t: (settings.customBackgroundSearch ?? null)\n\t\t\t\tconst nextLibrary = pickedSlots.library\n\t\t\t\t\t? await saveCustomBackgroundFile(pickedSlots.library, 'library')\n\t\t\t\t\t: (settings.customBackgroundLibrary ?? null)\n\t\t\t\tconst nextMy = pickedSlots.my\n\t\t\t\t\t? await saveCustomBackgroundFile(pickedSlots.my, 'my')\n\t\t\t\t\t: (settings.customBackgroundMy ?? null)\n\n\t\t\t\tsetSettings({\n\t\t\t\t\tcustomBackgroundSeparateTabs: true,\n\t\t\t\t\tcustomBackgroundSearch: nextSearch,\n\t\t\t\t\tcustomBackgroundLibrary: nextLibrary,\n\t\t\t\t\tcustomBackgroundMy: nextMy,\n\t\t\t\t})\n\t\t\t\tcleanupUnusedCustomBackgroundFiles([nextSearch, nextLibrary, nextMy])\n\t\t\t\ttoast.success('自定义背景图片已生效')\n\t\t\t\tonDismiss()\n\t\t\t} catch {\n\t\t\t\ttoast.error('保存背景图片失败