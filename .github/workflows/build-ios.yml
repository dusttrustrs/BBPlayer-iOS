se}\n\t\t\t\tcontentContainerStyle={styles.scrollContainer}\n\t\t\t>\n\t\t\t\t{THEME_COLOR_PRESETS.map((preset) => {\n\t\t\t\t\tconst active = isPresetMatch(preset.color) && !isCustomActive\n\t\t\t\t\tconst displayColor = preset.color ?? colors.primary\n\t\t\t\t\tconst isDark = (() => {\n\t\t\t\t\t\ttry {\n\t\t\t\t\t\t\treturn Color(displayColor).isDark()\n\t\t\t\t\t\t} catch {\n\t\t\t\t\t\t\treturn true\n\t\t\t\t\t\t}\n\t\t\t\t\t})()\n\n\t\t\t\t\treturn (\n\t\t\t\t\t\t<Pressable\n\t\t\t\t\t\t\tkey={preset.key}\n\t\t\t\t\t\t\tstyle={styles.item}\n\t\t\t\t\t\t\tonPress={() => handleSelectPreset(preset.color)}\n\t\t\t\t\t\t\taccessibilityRole='button'\n\t\t\t\t\t\t\taccessibilityLabel={`选择${preset.label}主题色`}\n\t\t\t\t\t\t>\n\t\t\t\t\t\t\t<View\n\t\t\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\t\t\tstyles.colorCircle,\n\t\t\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t\t\tbackgroundColor: preset.color ?? colors.primary,\n\t\t\t\t\t\t\t\t\t\tborderColor: active ? colors.onSurface : 'transparent',\n\t\t\t\t\t\t\t\t\t},\n\t\t\t\t\t\t\t\t\tactive && styles.activeCircle,\n\t\t\t\t\t\t\t\t]}\n\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t{active && (\n\t\t\t\t\t\t\t\t\t<Icon\n\t\t\t\t\t\t\t\t\t\tname='check'\n\t\t\t\t\t\t\t\t\t\tsize={22}\n\t\t\t\t\t\t\t\t\t\tcolor={isDark ? '#FFFFFF' : '#000000'}\n\t\t\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t\t\t)}\n\t\t\t\t\t\t\t</View>\n\t\t\t\t\t\t\t<Text\n\t\t\t\t\t\t\t\tvariant='bodySmall'\n\t\t\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\t\t\tstyles.label,\n\t\t\t\t\t\t\t\t\tactive\n\t\t\t\t\t\t\t\t\t\t? [styles.activeLabel, { color: colors.primary }]\n\t\t\t\t\t\t\t\t\t\t: { color: colors.onSurfaceVariant },\n\t\t\t\t\t\t\t\t]}\n\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t{preset.label}\n\t\t\t\t\t\t\t</Text>\n\t\t\t\t\t\t</Pressable>\n\t\t\t\t\t)\n\t\t\t\t})}\n\n\t\t\t\t{/* 自定义颜色选项 */}\n\t\t\t\t<Pressable\n\t\t\t\t\tstyle={styles.item}\n\t\t\t\t\tonPress={() => setPickerVisible(true)}\n\t\t\t\t\taccessibilityRole='button'\n\t\t\t\t\taccessibilityLabel='自定义主题色'\n\t\t\t\t>\n\t\t\t\t\t<View\n\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\tstyles.colorCircle,\n\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\tbackgroundColor: isCustomActive\n\t\t\t\t\t\t\t\t\t? themeColor\n\t\t\t\t\t\t\t\t\t: colors.surfaceVariant,\n\t\t\t\t\t\t\t\tborderColor: isCustomActive ? colors.onSurface : 'transparent',\n\t\t\t\t\t\t\t},\n\t\t\t\t\t\t\tisCustomActive && styles.activeCircle,\n\t\t\t\t\t\t]}\n\t\t\t\t\t>\n\t\t\t\t\t\t{isCustomActive ? (\n\t\t\t\t\t\t\t<Icon\n\t\t\t\t\t\t\t\tname='check'\n\t\t\t\t\t\t\t\tsize={22}\n\t\t\t\t\t\t\t\tcolor={\n\t\t\t\t\t\t\t\t\tthemeColor && Color(themeColor).isDark()\n\t\t\t\t\t\t\t\t\t\t? '#FFFFFF'\n\t\t\t\t\t\t\t\t\t\t: '#000000'\n\t\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t) : (\n\t\t\t\t\t\t\t<Icon\n\t\t\t\t\t\t\t\tname='palette-outline'\n\t\t\t\t\t\t\t\tsize={22}\n\t\t\t\t\t\t\t\tcolor={colors.onSurfaceVariant}\n\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t)}\n\t\t\t\t\t</View>\n\t\t\t\t\t<Text\n\t\t\t\t\t\tvariant='bodySmall'\n\t\t\t\t\t\tstyle={[\n\t\t\t\t\t\t\tstyles.label,\n\t\t\t\t\t\t\tisCustomActive\n\t\t\t\t\t\t\t\t? [styles.activeLabel, { color: colors.primary }]\n\t\t\t\t\t\t\t\t: { color: colors.onSurfaceVariant },\n\t\t\t\t\t\t]}\n\t\t\t\t\t>\n\t\t\t\t\t\t自定义\n\t\t\t\t\t</Text>\n\t\t\t\t</Pressable>\n\t\t\t</ScrollView>\n\n\t\t\t<ThemeColorPickerModal\n\t\t\t\tvisible={pickerVisible}\n\t\t\t\tcurrentColor={isCustomActive ? themeColor : undefined}\n\t\t\t\tonDismiss={() => setPickerVisible(false)}\n\t\t\t\tonSelect={handleCustomColorSelected}\n\t\t\t/>\n\t\t</View>\n\t)\n}\n\nconst styles = StyleSheet.create({\n\tcontainer: {\n\t\tmarginTop: 8,\n\t\tmarginBottom: 8,\n\t},\n\tscrollContainer: {\n\t\tflexDirection: 'row',\n\t\talignItems: 'center',\n\t\tpaddingVertical: 8,\n\t\tpaddingRight: 16,\n\t\tgap: 16,\n\t},\n\titem: {\n\t\talignItems: 'center',\n\t\tjustifyContent: 'center',\n\t},\n\tcolorCircle: {\n\t\twidth: 44,\n\t\theight: 44,\n\t\tborderRadius: 22,\n\t\talignItems: 'center',\n\t\tjustifyContent: 'center',\n\t\tborderWidth: 2,\n\t},\n\tactiveCircle: {\n\t\tborderWidth: 2.5,\n\t\ttransform: [{ scale: 1.08 }],\n\t\televation: 3,\n\t\tshadowColor: '#000',\n\t\tshadowOffset: { width: 0, height: 2 },\n\t\tshadowOpacity: 0.25,\n\t\tshadowRadius: 3.84,\n\t},\n\tlabel: {\n\t\tmarginTop: 6,\n\t\ttextAlign: 'center',\n\t\tfontWeight: '500',\n\t},\n\tactiveLabel: {\n\t\tfontWeight: 'bold',\n\t},\n})\n", "utf8");
