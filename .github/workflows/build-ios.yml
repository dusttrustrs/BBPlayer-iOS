              "        onStartShouldSetPanResponder: () => true,",
              "        onMoveShouldSetPanResponder: () => true,",
              "        onPanResponderGrant: (evt) => {",
              "          const locationX = evt.nativeEvent.locationX",
              "          const fraction = Math.max(0, Math.min(1, locationX / (sliderWidth || 1)))",
              "          const actualVal = MIN_SPEED + fraction * (MAX_SPEED - MIN_SPEED)",
              "          handleValueChange(actualVal)",
              "        },",
              "        onPanResponderMove: (evt) => {",
              "          const locationX = evt.nativeEvent.locationX",
              "          const fraction = Math.max(0, Math.min(1, locationX / (sliderWidth || 1)))",
              "          const actualVal = MIN_SPEED + fraction * (MAX_SPEED - MIN_SPEED)",
              "          handleValueChange(actualVal)",
              "        },",
              "        onPanResponderRelease: () => {",
              "          void commitSpeed(pendingSpeedRef.current)",
              "        },",
              "      }),",
              "    [sliderWidth],",
              "  )",
              "",
              "  const progressRatio = Math.max(0, Math.min(1, (speed - MIN_SPEED) / (MAX_SPEED - MIN_SPEED)))",
              "",
              "  return (",
              "    <>",
              "      <Dialog.Title>播放速度</Dialog.Title>",
              "      <Dialog.Content>",
              "        <View style={styles.headerContainer}>",
              "          <Text variant='headlineMedium' style={styles.speedDisplay}>",
