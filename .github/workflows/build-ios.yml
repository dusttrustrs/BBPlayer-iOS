name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动一键触发构建
    inputs:
      release_version:
        description: '应用版本号（x.y.z，例如 1.2.2）'
        required: true
        default: '1.2.2'
        type: string
  push:
    branches:
      - master
      - main
      - dev
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/build-ios.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build Unsigned IPA
    # 关键修复 1：必须使用 macos-26 (Apple Silicon arm64，默认预装 Xcode 26.6 / Build 17F113 / Swift 6.3.3 / iOS 26.5 Runtime)
    # 原因：
    # 1) 项目启用的 @rnrepo/expo-config-plugin 预编译 xcframework 产物均由 Xcode 26.6 (17F113, Swift 6.3.3, iphoneos26.5) 编译，
    #    在 macos-15 (Xcode 16.4 / Swift 6.1 或最高 Xcode 26.3 / Swift 6.2) 上会因编译器与 SDK 版本过旧导致编译失败 (exit code 65)。
    # 2) macos-26 默认自带与 Xcode 26.6 完全匹配的 iOS 26.5 Simulator Runtime，actool 编译 Assets.xcassets 不会再报版本不匹配。
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      EXPO_NO_TELEMETRY: '1'
      RELEASE_VERSION: ${{ github.event.inputs.release_version || '1.2.2' }}

    steps:
      - name: 🏗️ 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史以便 app.config.ts 计算 git commit 数量作为 versionCode

      - name: 🍎 校验并选择与 Simulator Runtime 精确匹配的 Xcode
        run: |
          echo "=== Runner 已安装的 Xcode 列表 ==="
          ls -d /Applications/Xcode*.app
          echo "=== Runner 已安装的 Simulator Runtimes ==="
          xcrun simctl list runtimes -v || true
          # 提取已安装的 Simulator Runtime Build 版本号集合
          INSTALLED_RUNTIMES=$(xcrun simctl list runtimes | grep -oE '[0-9]{2}[A-Z][0-9A-Za-z]+' || true)
          # 先检查当前默认 Xcode 的 SDKSettings.plist 是否已精确匹配 Runtime
          CURRENT_SDK_BUILD=$(xcrun --sdk iphonesimulator --show-sdk-build-version 2>/dev/null || echo "")
          echo "当前默认 Xcode iphonesimulator SDK Build: $CURRENT_SDK_BUILD"
          if [ -z "$CURRENT_SDK_BUILD" ] || ! echo "$INSTALLED_RUNTIMES" | grep -qx "$CURRENT_SDK_BUILD"; then
            echo "默认 Xcode SDK ($CURRENT_SDK_BUILD) 未精确匹配 Runtime，开始从高到低自动搜索匹配的 Xcode..."
            for xcode in $(ls -d /Applications/Xcode_*.app | sort -V -r); do
              SDK_SETTINGS="$xcode/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/SDKSettings.plist"
              if [ -f "$SDK_SETTINGS" ]; then
                SDK_BUILD=$(/usr/libexec/PlistBuddy -c "Print :DefaultProperties:BUILD_VERSION" "$SDK_SETTINGS" 2>/dev/null || echo "")
                echo "检查 $xcode -> SDK Build: $SDK_BUILD"
                if [ -n "$SDK_BUILD" ] && echo "$INSTALLED_RUNTIMES" | grep -qx "$SDK_BUILD"; then
                  echo "✅ 切换至与 Simulator Runtime ($SDK_BUILD) 100% 匹配的 Xcode: $xcode"
                  sudo xcode-select -s "$xcode/Contents/Developer"
                  break
                fi
              fi
            done
          else
            echo "✅ 当前默认 Xcode 已与已安装的 Simulator Runtime ($CURRENT_SDK_BUILD) 100% 匹配"
          fi
          xcodebuild -version
          xcrun swiftc -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-build-version
      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 配置 pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📦 为 apps/mobile 预注入 expo-widgets 依赖
        run: |
          node -e '
            const fs = require("fs");
            const pkgPath = "apps/mobile/package.json";
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
              pkg.dependencies = pkg.dependencies || {};
              if (!pkg.dependencies["expo-widgets"]) {
                pkg.dependencies["expo-widgets"] = "~57.0.27";
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2), "utf8");
                console.log("✅ 已向 apps/mobile/package.json 注入 expo-widgets 依赖");
              }
            }
          '

      - name: 🔄 注入横屏播放器 (横屏布局 + 元素飞入编排 + 非播放页锁竖屏)
        run: |
          cat > /tmp/PlayerMainTab.landscape.tsx << 'EOF_LANDSCAPE_TSX'
          import { Show } from '@legendapp/state/react'
          import type { ImageRef } from 'expo-image'
          import { useRouter } from 'expo-router'
          import { memo, useEffect } from 'react'
          import { StyleSheet, useWindowDimensions, View } from 'react-native'
          import { ScrollView } from 'react-native-gesture-handler'
          import Animated, {
          	Easing,
          	useAnimatedStyle,
          	useSharedValue,
          	withTiming,
          } from 'react-native-reanimated'
          import { useSafeAreaInsets } from 'react-native-safe-area-context'

          import { PlayerControls } from '@/features/player/components/controls/PlayerControls'
          import useCurrentTrack from '@/hooks/player/useCurrentTrack'
          import { playbackContextStore$ } from '@/hooks/stores/playbackContextStore'
          import { usePlayerQueueSheetStore } from '@/hooks/stores/usePlayerQueueSheetStore'
          import * as Haptics from '@/utils/haptics'

          import { PlayerSlider } from './PlayerSlider'
          import { TrackInfo } from './PlayerTrackInfo'

          interface PlayerMainTabProps {
          	jumpTo: (key: string) => void
          	imageRef: ImageRef | null
          	onPresent: () => void
          }

          const PlayerMainTab = memo(function PlayerMainTab({
          	jumpTo,
          	imageRef,
          	onPresent,
          }: PlayerMainTabProps) {
          	const router = useRouter()
          	const insets = useSafeAreaInsets()
          	const currentTrack = useCurrentTrack()
          	const { width, height } = useWindowDimensions()
          	const isLandscape = width > height

          	// 0 = 刚旋转完（元素还在「旧位置」），1 = 各就各位；每次方向变化重播一遍编排
          	const p = useSharedValue(1)
          	useEffect(() => {
          		p.set(0)
          		const curve = Easing.bezier(0.2, 0.8, 0.2, 1)
          		p.set(withTiming(1, { duration: 520, easing: curve }))
          	}, [isLandscape, p])

          	const dir = isLandscape ? 1 : -1
          	const coverStyle = useAnimatedStyle(() => ({
          		opacity: 0.4 + 0.6 * p.value,
          		transform: [
          			{ translateX: dir * -width * 0.22 * (1 - p.value) },
          			{ translateY: dir * height * 0.12 * (1 - p.value) },
          			{ rotateZ: `${-6 * (1 - p.value)}deg` },
          			{ scale: 1 + 0.12 * (1 - p.value) },
          		],
          	}))
          	const delayed = (d: number) => {
          		'worklet'
          		return Math.min(1, Math.max(0, (p.value * 520 - d) / (520 - d)))
          	}
          	const infoStyle = useAnimatedStyle(() => {
          		const t = delayed(60)
          		return {
          			opacity: 0.3 + 0.7 * t,
          			transform: [{ translateY: 90 * (1 - t) }],
          		}
          	})
          	const sliderStyle = useAnimatedStyle(() => {
          		const t = delayed(110)
          		return {
          			opacity: 0.3 + 0.7 * t,
          			transform: [{ translateX: dir * 60 * (1 - t) }, { scaleX: 0.85 + 0.15 * t }],
          		}
          	})
          	const controlsStyle = useAnimatedStyle(() => {
          		const t = delayed(150)
          		// 控件从中心向两侧「展开」：先收拢再散开
          		return {
          			opacity: 0.2 + 0.8 * t,
          			transform: [{ scaleX: 0.6 + 0.4 * t }, { scale: 0.9 + 0.1 * t }],
          		}
          	})

          	if (!currentTrack) return null
          	if (isLandscape) {
          		const padH = Math.max(insets.left, insets.right, 24)
          		const coverSize = Math.min(width * 0.42, height - 56 - 24)
          		return (
          			<Show if={playbackContextStore$.ready}>
          				<View style={[styles.landscapeRow, { paddingHorizontal: padH }]}>
          					<Animated.View style={[styles.landscapeLeft, coverStyle]}>
          						<TrackInfo
          							part='cover'
          							coverMaxSize={coverSize}
          							onArtistPress={() => void 0}
          							onPressCover={() => {
          								void Haptics.performHaptics(
          									Haptics.AndroidHaptics.Context_Click,
          								)
          								jumpTo('lyrics')
          							}}
          							coverRef={imageRef}
          						/>
          					</Animated.View>
          					<View style={styles.landscapeRight}>
          						<Animated.View style={infoStyle}>
          							<TrackInfo
          								part='info'
          								onArtistPress={() =>
          									currentTrack.artist?.remoteId
          										? router.navigate({
          												pathname: '/playlist/remote/uploader/[mid]',
          												params: { mid: currentTrack.artist?.remoteId },
          											})
          										: void 0
          								}
          								onPressCover={() => void 0}
          								coverRef={imageRef}
          							/>
          						</Animated.View>
          						<Animated.View style={[styles.landscapeGap, sliderStyle]}>
          							<PlayerSlider />
          						</Animated.View>
          						<Animated.View style={controlsStyle}>
          							<PlayerControls
          								onOpenQueue={() => {
          									onPresent()
          									void usePlayerQueueSheetStore.getState().open()
          								}}
          							/>
          						</Animated.View>
          					</View>
          				</View>
          			</Show>
          		)
          	}
          	return (
          		<Show if={playbackContextStore$.ready}>
          			<ScrollView
          				contentContainerStyle={styles.container}
          				showsVerticalScrollIndicator={false}
          			>
          				<TrackInfo
          					onArtistPress={() =>
          						currentTrack.artist?.remoteId
          							? router.navigate({
          									pathname: '/playlist/remote/uploader/[mid]',
          									params: { mid: currentTrack.artist?.remoteId },
          								})
          							: void 0
          					}
          					onPressCover={() => {
          						void Haptics.performHaptics(Haptics.AndroidHaptics.Context_Click)
          						jumpTo('lyrics')
          					}}
          					coverRef={imageRef}
          				/>

          				<View
          					style={[
          						{ paddingBottom: Math.max(insets.bottom + 20, 20) },
          						styles.controlsContainer,
          					]}
          				>
          					<PlayerSlider />
          					<PlayerControls
          						onOpenQueue={() => {
          							onPresent()
          							void usePlayerQueueSheetStore.getState().open()
          						}}
          					/>
          				</View>
          			</ScrollView>
          		</Show>
          	)
          })

          const styles = StyleSheet.create({
          	container: {
          		flexGrow: 1,
          		justifyContent: 'space-between',
          	},
          	controlsContainer: {
          		paddingHorizontal: 24,
          	},
          	landscapeRow: {
          		flex: 1,
          		flexDirection: 'row',
          		alignItems: 'center',
          		gap: 24,
          	},
          	landscapeLeft: {
          		flex: 0.42,
          		alignItems: 'center',
          		justifyContent: 'center',
          	},
          	landscapeRight: {
          		flex: 0.58,
          		justifyContent: 'center',
          	},
          	landscapeGap: {
          		marginTop: 16,
          		marginBottom: 20,
          	},
          })

          PlayerMainTab.displayName = 'PlayerMainTab'
          export default PlayerMainTab
          EOF_LANDSCAPE_TSX
          cat > /tmp/LandscapePlayer.tsx << 'EOF_LANDSCAPE_PLAYER'
          import { Show } from '@legendapp/state/react'
          import type { ImageRef } from 'expo-image'
          import { useRouter } from 'expo-router'
          import { useEffect, useState } from 'react'
          import { StyleSheet, useWindowDimensions, View } from 'react-native'
          import PagerView from 'react-native-pager-view'
          import Animated, {
          	Easing,
          	useAnimatedStyle,
          	useSharedValue,
          	withTiming,
          } from 'react-native-reanimated'
          import { useSafeAreaInsets } from 'react-native-safe-area-context'

          import { PlayerControls } from '@/features/player/components/controls/PlayerControls'
          import Lyrics from '@/features/player/components/lyrics/PlayerLyrics'
          import { PlayerSlider } from '@/features/player/components/main/PlayerSlider'
          import { TrackInfo } from '@/features/player/components/main/PlayerTrackInfo'
          import useCurrentTrack from '@/hooks/player/useCurrentTrack'
          import { playbackContextStore$ } from '@/hooks/stores/playbackContextStore'
          import { usePlayerQueueSheetStore } from '@/hooks/stores/usePlayerQueueSheetStore'
          import * as Haptics from '@/utils/haptics'

          const AnimatedPagerView = Animated.createAnimatedComponent(PagerView)

          /**
           * 横屏播放器：左侧封面常驻且居中；右侧是一个小 PagerView（播放控制 / 歌词）。
           * 左滑进入歌词时，歌词页从右侧平滑切换，封面保持不动。
           */
          export function LandscapePlayer({
          	pagerRef,
          	index,
          	setIndex,
          	jumpTo,
          	imageRef,
          	onPageScroll,
          }: {
          	pagerRef: React.RefObject<PagerView | null>
          	index: number
          	setIndex: (i: number) => void
          	jumpTo: (key: string) => void
          	imageRef: ImageRef | null
          	onPageScroll: unknown
          }) {
          	const router = useRouter()
          	const insets = useSafeAreaInsets()
          	const currentTrack = useCurrentTrack()
          	const { width, height } = useWindowDimensions()
          	const [isScrubbing, setIsScrubbing] = useState(false)

          	// 进入横屏平滑动画
          	const p = useSharedValue(1)
          	useEffect(() => {
          		p.set(0)
          		p.set(
          			withTiming(1, {
          				duration: 480,
          				easing: Easing.bezier(0.2, 0.8, 0.2, 1),
          			}),
          		)
          	}, [p])

          	const coverStyle = useAnimatedStyle(() => ({
          		transform: [{ scale: 0.94 + 0.06 * p.value }],
          		opacity: 0.5 + 0.5 * p.value,
          	}))

          	const rightStyle = useAnimatedStyle(() => ({
          		transform: [{ translateX: 50 * (1 - p.value) }],
          		opacity: 0.6 + 0.4 * p.value,
          	}))

          	if (!currentTrack) return null
          	const padL = Math.max(insets.left, 24)
          	const padR = Math.max(insets.right, 24)

          	// 动态计算封面尺寸：居中并充分利用高度与宽度，不再受制于过小的 220px 限制
          	const availHeight = height - 52 - Math.max(insets.bottom, 12)
          	const availWidth = (width - padL - padR - 32) * 0.44
          	const coverSize = Math.floor(Math.min(availWidth, availHeight * 0.94, 340))
          	const isPodcast = playbackContextStore$.context.mode.peek() === 'podcast'

          	return (
          		<Show if={playbackContextStore$.ready}>
          			<View
          				style={[
          					styles.row,
          					{
          						paddingLeft: padL,
          						paddingRight: padR,
          						paddingBottom: Math.max(insets.bottom, 8),
          					},
          				]}
          			>
          				{/* 左侧封面居中常驻展示 */}
          				<Animated.View style={[styles.left, coverStyle]}>
          					<TrackInfo
          						part='cover'
          						coverMaxSize={coverSize}
          						onArtistPress={() => void 0}
          						onPressCover={() => {
          							void Haptics.performHaptics(Haptics.AndroidHaptics.Context_Click)
          							jumpTo(index === 1 ? 'main' : 'lyrics')
          						}}
          						coverRef={imageRef}
          					/>
          				</Animated.View>

          				{/* 右侧分页：主控制页 / 纯歌词页 */}
          				<Animated.View style={[styles.right, rightStyle]}>
          					<AnimatedPagerView
          						key={isPodcast ? 'podcast' : 'music'}
          						ref={pagerRef}
          						style={styles.flex}
          						initialPage={index}
          						scrollEnabled={!isPodcast && !isScrubbing}
          						// eslint-disable-next-line @typescript-eslint/no-explicit-any
          						onPageScroll={onPageScroll as any}
          						onPageSelected={(e) => setIndex(e.nativeEvent.position)}
          					>
          						{[
          							<View
          								key='main'
          								style={styles.page}
          							>
          								<TrackInfo
          									part='info'
          									onArtistPress={() =>
          										currentTrack.artist?.remoteId
          											? router.navigate({
          													pathname: '/playlist/remote/uploader/[mid]',
          													params: { mid: currentTrack.artist?.remoteId },
          												})
          											: void 0
          									}
          									onPressCover={() => void 0}
          									coverRef={imageRef}
          								/>
          								<View style={styles.gap}>
          									<PlayerSlider onDragStateChange={setIsScrubbing} />
          								</View>
          								<PlayerControls
          									onOpenQueue={() => {
          										void usePlayerQueueSheetStore.getState().open()
          									}}
          								/>
          							</View>,
          							...(isPodcast
          								? []
          								: [
          										<View
          											key='lyrics'
          											style={styles.flex}
          										>
          											<Lyrics
          												currentIndex={index}
          												onPressBackground={() => jumpTo('main')}
          											/>
          										</View>,
          									]),
          						]}
          					</AnimatedPagerView>
          				</Animated.View>
          			</View>
          		</Show>
          	)
          }

          const styles = StyleSheet.create({
          	flex: { flex: 1 },
          	row: {
          		flex: 1,
          		flexDirection: 'row',
          		alignItems: 'center',
          		gap: 20,
          	},
          	left: {
          		flex: 0.44,
          		alignItems: 'center',
          		justifyContent: 'center',
          		alignSelf: 'stretch',
          	},
          	right: {
          		flex: 0.56,
          		alignSelf: 'stretch',
          	},
          	page: {
          		flex: 1,
          		justifyContent: 'center',
          		paddingHorizontal: 8,
          	},
          	gap: {
          		marginTop: 14,
          		marginBottom: 16,
          	},
          })
          EOF_LANDSCAPE_PLAYER
          node << 'EOF'
          const fs = require("fs");
          const rw = (p, fn) => { if (!fs.existsSync(p)) { console.log("⚠️ 未找到 " + p); return; } const a = fs.readFileSync(p, "utf8"); const b = fn(a); if (b !== a) fs.writeFileSync(p, b, "utf8"); return b !== a; };
          const rep = (src, a, b, label) => { if (!src.includes(a)) { console.log("⚠️ 横屏补丁锚点未命中: " + label); return src; } return src.replace(a, b); };
          // 1. package.json 依赖
          rw("apps/mobile/package.json", (t) => { if (t.includes("expo-screen-orientation")) return t; const pkg = JSON.parse(t); pkg.dependencies["expo-screen-orientation"] = "~57.0.3"; return JSON.stringify(pkg, null, 2); });
          // 2. app.config.ts：允许旋转 + 插件
          rw("apps/mobile/app.config.ts", (t) => {
            t = t.replace(/orientation:\s*'portrait'/, "orientation: 'default'");
            if (!t.includes("'expo-screen-orientation'")) t = rep(t, "'expo-widgets',", "'expo-widgets',\n\t\t\t'expo-screen-orientation',", "app.config plugins");
            return t;
          });
          // 3. index.js：启动即锁竖屏
          rw("apps/mobile/index.js", (t) => {
            if (t.includes("expo-screen-orientation")) return t;
            return rep(t, "playerSideEffects.initialize()\n", "playerSideEffects.initialize()\n\nimport * as ScreenOrientation from 'expo-screen-orientation'\n\nvoid ScreenOrientation.lockAsync(\n\tScreenOrientation.OrientationLock.PORTRAIT_UP,\n).catch(() => undefined)\n", "index.js");
          });
          // 4. player.tsx：仅播放页解锁
          rw("apps/mobile/src/app/player.tsx", (t) => {
            if (t.includes("expo-screen-orientation")) return t;
            t = rep(t, "import { router, useIsFocused } from 'expo-router'", "import * as ScreenOrientation from 'expo-screen-orientation'\nimport { router, useIsFocused } from 'expo-router'", "player import");
            t = rep(t, "\t\tmarkInteractive()\n\t}, [markInteractive])\n", "\t\tmarkInteractive()\n\t}, [markInteractive])\n\n\t// 只有播放页允许横屏，离开时锁回竖屏\n\tuseEffect(() => {\n\t\tif (Platform.OS !== 'ios') return\n\t\tvoid ScreenOrientation.unlockAsync().catch(() => void 0)\n\t\treturn () => {\n\t\t\tvoid ScreenOrientation.lockAsync(\n\t\t\t\tScreenOrientation.OrientationLock.PORTRAIT_UP,\n\t\t\t).catch(() => void 0)\n\t\t}\n\t}, [])\n", "player effect");
            return t;
          });
          rw("apps/mobile/src/app/player.tsx", (t) => {
            if (t.includes("<LandscapePlayer")) return t;
            t = rep(t, "import Lyrics from", "import { LandscapePlayer } from '@/features/player/components/main/LandscapePlayer'\nimport Lyrics from", "LP import");
            const open = "\t\t\t\t\t\t<Computed>\n\t\t\t\t\t\t\t<AnimatedPagerView";
            const close = "</AnimatedPagerView>\n\t\t\t\t\t\t</Computed>\n";
            if (!t.includes(open) || !t.includes(close)) { console.log("⚠️ 横屏补丁锚点未命中: player pager"); return t; }
            t = t.replace(open, "\t\t\t\t\t\t{width > height ? (\n\t\t\t\t\t\t\t<LandscapePlayer\n\t\t\t\t\t\t\t\tpagerRef={pagerRef}\n\t\t\t\t\t\t\t\tindex={index}\n\t\t\t\t\t\t\t\tsetIndex={setIndex}\n\t\t\t\t\t\t\t\tjumpTo={jumpTo}\n\t\t\t\t\t\t\t\timageRef={coverRef}\n\t\t\t\t\t\t\t\tonPageScroll={pageScrollHandler}\n\t\t\t\t\t\t\t/>\n\t\t\t\t\t\t) : (\n" + open);
            t = t.replace(close, close + "\t\t\t\t\t\t)}\n");
            return t;
          });
          if (!fs.existsSync("apps/mobile/src/features/player/components/main/LandscapePlayer.tsx")) fs.copyFileSync("/tmp/LandscapePlayer.tsx", "apps/mobile/src/features/player/components/main/LandscapePlayer.tsx");
          // 5. PlayerTrackInfo.tsx：支持 part / coverMaxSize
          rw("apps/mobile/src/features/player/components/main/PlayerTrackInfo.tsx", (t) => {
