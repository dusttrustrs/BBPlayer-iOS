          // 11. 开启 iOS 灵动岛系统动画、后台控制与音频中断互斥联动：
          // (a) 在主线程调用 UIApplication.shared.beginReceivingRemoteControlEvents() 注册系统控制权；
          // (b) 每次播放状态变化时，显式同步 MPNowPlayingInfoCenter.default().playbackState (.playing / .paused)，
          //     配置 longFormAudio 与 setActive(true)，使 SpringBoard 识别前台 App 为活跃音频源，在向上滑动返回桌面时触发“飞入灵动岛”系统级流体动画；
          // (c) 在 play()、pause() 和 loadAvPlayerItem 中保持音频会话激活与实时更新状态；
          // (d) 在其他应用播放音频时互斥暂停，关闭联动时保留混音后台播放。
          const playerMgrPath = "packages/orpheus/ios/OrpheusPlayerManager.swift";
          if (fs.existsSync(playerMgrPath)) {
            let playerMgr = fs.readFileSync(playerMgrPath, "utf8");
            if (!playerMgr.includes("setAllowSimultaneousPlayback")) {
              const systemIntegrationPattern = /\/\/ MARK: - System Integration[\s\S]*?(?=private func downloadImage\(url: URL)/;
              if (systemIntegrationPattern.test(playerMgr)) {
                const newSystemIntegrationBlock = [
                  '// MARK: - System Integration',
                  '    ',
                  '    private var isSimultaneousPlaybackAllowed = false',
                  '    private var enableSystemMediaControl: Bool = true',
                  '',
                  '    func setAllowSimultaneousPlayback(_ enabled: Bool) {',
                  '        isSimultaneousPlaybackAllowed = enabled',
                  '        enableSystemMediaControl = !enabled',
                  '        setupAudioSession()',
                  '        if enabled {',
                  '            MPNowPlayingInfoCenter.default().nowPlayingInfo = nil',
                  '            MPNowPlayingInfoCenter.default().playbackState = .stopped',
                  '        } else {',
                  '            updateNowPlayingInfo()',
                  '        }',
                  '    }',
                  '',
                  '    private func setupAudioSession() {',
                  '        do {',
                  '            let session = AVAudioSession.sharedInstance()',
                  '            let options: AVAudioSession.CategoryOptions = isSimultaneousPlaybackAllowed ? [.mixWithOthers] : []',
                  '            if isSimultaneousPlaybackAllowed {',
                  '                try session.setCategory(.playback, mode: .default, options: options)',
                  '            } else {',
                  '                try session.setCategory(.playback, mode: .default, options: options)',
                  '            }',
                  '            try session.setActive(true)',
                  '            NotificationCenter.default.removeObserver(self, name: AVAudioSession.interruptionNotification, object: session)',
                  '            NotificationCenter.default.addObserver(self, selector: #selector(handleInterruption), name: AVAudioSession.interruptionNotification, object: session)',
                  '        } catch {',
                  '',
                  '        }',
                  '    }',
                  '    ',
                  '    @objc private func handleInterruption(notification: Notification) {',
                  '        if isSimultaneousPlaybackAllowed {',
                  '            return',
                  '        }',
                  '        guard let userInfo = notification.userInfo,',
                  '              let typeValue = userInfo[AVAudioSessionInterruptionTypeKey] as? UInt,',
                  '              let type = AVAudioSession.InterruptionType(rawValue: typeValue) else { return }',
                  '        ',
                  '        if type == .began {',
                  '            DispatchQueue.main.async { [weak self] in',
                  '                self?.pause()',
                  '            }',
                  '        } else if type == .ended {',
                  '            if let optionsValue = userInfo[AVAudioSessionInterruptionOptionKey] as? UInt {',
                  '                let options = AVAudioSession.InterruptionOptions(rawValue: optionsValue)',
                  '                if options.contains(.shouldResume) {',
                  '                    DispatchQueue.main.async { [weak self] in',
                  '                        self?.play()',
                  '                    }',
                  '                }',
                  '            }',
                  '        }',
                  '    }',
                  '    ',
                  '    private func setupRemoteCommands() {',
                  '        DispatchQueue.main.async {',
                  '            UIApplication.shared.beginReceivingRemoteControlEvents()',
                  '        }',
                  '        let commandCenter = MPRemoteCommandCenter.shared()',
                  '        ',
                  '        commandCenter.togglePlayPauseCommand.isEnabled = true',
                  '        commandCenter.playCommand.isEnabled = true',
                  '        commandCenter.pauseCommand.isEnabled = true',
                  '        commandCenter.nextTrackCommand.isEnabled = true',
                  '        commandCenter.previousTrackCommand.isEnabled = true',
                  '        commandCenter.changePlaybackPositionCommand.isEnabled = true',
                  '        ',
                  '        commandCenter.togglePlayPauseCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            if self.isPlaying() {',
                  '                self.pause()',
                  '            } else {',
                  '                self.play()',
                  '            }',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.playCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.play()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.pauseCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.pause()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.nextTrackCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.playNext()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.previousTrackCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            self.skipToPrevious()',
                  '            return .success',
                  '        }',
                  '        ',
                  '        commandCenter.changePlaybackPositionCommand.addTarget { [weak self] event in',
                  '            guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return .commandFailed }',
                  '            if let event = event as? MPChangePlaybackPositionCommandEvent {',
                  '                self.seek(to: event.positionTime)',
                  '                return .success',
                  '            }',
                  '            return .commandFailed',
                  '        }',
                  '    }',
                  '    ',
                  '    private func updateNowPlayingInfo() {',
                  '        guard enableSystemMediaControl && !isSimultaneousPlaybackAllowed else {',
                  '            MPNowPlayingInfoCenter.default().nowPlayingInfo = nil',
                  '            MPNowPlayingInfoCenter.default().playbackState = .stopped',
                  '            return',
                  '        }',
                  '        guard let track = getCurrentTrack() else {',
                  '            MPNowPlayingInfoCenter.default().nowPlayingInfo = nil',
                  '            MPNowPlayingInfoCenter.default().playbackState = .stopped',
                  '            return',
                  '        }',
                  '        ',
                  '        let isPlayingState = (self.player.timeControlStatus == .playing || self.player.timeControlStatus == .waitingToPlayAtSpecifiedRate || self.player.rate > 0 || self.isPlaying())',
                  '        let playbackRate: Double = isPlayingState ? (self.player.rate > 0 ? Double(self.player.rate) : 1.0) : 0.0',
                  '        ',
                  '        var info: [String: Any] = [',
                  '            MPMediaItemPropertyTitle: track.title ?? "Unknown Title",',
                  '            MPMediaItemPropertyArtist: track.artist ?? "Unknown Artist",',
                  '            MPNowPlayingInfoPropertyElapsedPlaybackTime: player.currentTime().seconds,',
                  '            MPNowPlayingInfoPropertyPlaybackRate: playbackRate,',
                  '            MPNowPlayingInfoPropertyDefaultPlaybackRate: 1.0,',
                  '            MPNowPlayingInfoPropertyPlaybackQueueIndex: queueManager.getCurrentIndex(),',
                  '            MPNowPlayingInfoPropertyPlaybackQueueCount: queueManager.getQueueCount()',
                  '        ]',
                  '        ',
                  '        if let duration = track.duration, duration > 0 {',
                  '             info[MPMediaItemPropertyPlaybackDuration] = duration',
                  '        } else if let playerDuration = player.currentItem?.duration.seconds, !playerDuration.isNaN, playerDuration > 0 {',
                  '             info[MPMediaItemPropertyPlaybackDuration] = playerDuration',
                  '        }',
                  '        ',
                  '        if let artworkUrlStr = track.artwork {',
                  '            if let cached = imageCache.object(forKey: artworkUrlStr as NSString) {',
                  '                let artwork = MPMediaItemArtwork(boundsSize: cached.size) { _ in cached }',
                  '                info[MPMediaItemPropertyArtwork] = artwork',
                  '            } else if let artworkUrl = URL(string: artworkUrlStr) {',
                  '                downloadImage(url: artworkUrl) { [weak self] image in',
                  '                    guard let self = self, self.enableSystemMediaControl && !self.isSimultaneousPlaybackAllowed else { return }',
                  '                    guard let image = image else { return }',
                  '                    self.imageCache.setObject(image, forKey: artworkUrlStr as NSString)',
                  '                    DispatchQueue.main.async {',
                  '                        if var currentInfo = MPNowPlayingInfoCenter.default().nowPlayingInfo {',
                  '                            if currentInfo[MPMediaItemPropertyTitle] as? String == track.title {',
                  '                                 let artwork = MPMediaItemArtwork(boundsSize: image.size) { _ in image }',
                  '                                 currentInfo[MPMediaItemPropertyArtwork] = artwork',
                  '                                 MPNowPlayingInfoCenter.default().nowPlayingInfo = currentInfo',
                  '                            }',
                  '                        } else {',
                  '                            info[MPMediaItemPropertyArtwork] = MPMediaItemArtwork(boundsSize: image.size) { _ in image }',
                  '                            MPNowPlayingInfoCenter.default().nowPlayingInfo = info',
                  '                        }',
                  '                    }',
                  '                }',
                  '            }',
                  '        }',
                  '        ',
                  '        MPNowPlayingInfoCenter.default().nowPlayingInfo = info',
                  '        MPNowPlayingInfoCenter.default().playbackState = isPlayingState ? .playing : .paused',
                  '    }',
                  '    \n    '
                ].join("\n");
                playerMgr = playerMgr.replace(systemIntegrationPattern, newSystemIntegrationBlock);
              }
              const playPausePattern = /player\.play\(\)\s*\}\s*func pause\(\)\s*\{\s*player\.pause\(\)\s*\}/;
              if (playPausePattern.test(playerMgr)) {
                playerMgr = playerMgr.replace(playPausePattern, [
                  'setupAudioSession()',
                  '        DispatchQueue.main.async {',
                  '            UIApplication.shared.beginReceivingRemoteControlEvents()',
                  '        }',
                  '        player.play()',
                  '        updateNowPlayingInfo()',
                  '    }',
                  '    ',
                  '    func pause() {',
                  '        player.pause()',
                  '        if enableSystemMediaControl && !isSimultaneousPlaybackAllowed {',
                  '            MPNowPlayingInfoCenter.default().playbackState = .paused',
                  '        }',
                  '        updateNowPlayingInfo()',
                  '    }'
                ].join("\n"));
              }
              const replaceItemPattern = /player\.replaceCurrentItem\(with: item\)[\s\S]*?player\.play\(\)/;
              if (replaceItemPattern.test(playerMgr)) {
                playerMgr = playerMgr.replace(
                  replaceItemPattern,
                  [
                    'setupAudioSession()',
                    '        DispatchQueue.main.async {',
                    '            UIApplication.shared.beginReceivingRemoteControlEvents()',
                    '        }',
                    '        player.replaceCurrentItem(with: item)',
                    '        if let startPos = startPosition, startPos > 0 {',
                    '             let time = CMTime(seconds: startPos, preferredTimescale: 1000)',
                    '             player.seek(to: time, toleranceBefore: .zero, toleranceAfter: .zero)',
                    '        }',
                    '        player.play()',
                    '        updateNowPlayingInfo()'
                  ].join("\n")
                );
              }
              fs.writeFileSync(playerMgrPath, playerMgr, "utf8");
              console.log("✅ 已配置 OrpheusPlayerManager.swift 支持系统灵动岛飞入动画与 NowPlaying 同步");
            }
