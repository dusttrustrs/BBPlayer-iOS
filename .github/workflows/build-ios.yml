            const endDefIdx = modSource.lastIndexOf('  }');
            if (endDefIdx !== -1) {
              modSource = modSource.slice(0, endDefIdx) + '\n' + viewRegCode + '\n' + modSource.slice(endDefIdx);
              fs.writeFileSync(modulePath, modSource, "utf8");
