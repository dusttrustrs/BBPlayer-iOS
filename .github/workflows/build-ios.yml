              "        inversePrimary = c.darken(0.2).hex()",
              "      } else {",
              "        primary = c.hex()",
              "        onPrimary = c.isDark() ? '#ffffff' : '#000000'",
              "        primaryContainer = c.mix(ColorJS('#ffffff'), 0.85).hex()",
              "        onPrimaryContainer = c.darken(0.5).hex()",
              "        secondary = c.mix(ColorJS(fallback.secondary), 0.35).hex()",
              "        secondaryContainer = c.mix(ColorJS('#ffffff'), 0.88).hex()",
              "        onSecondaryContainer = c.darken(0.4).hex()",
              "        inversePrimary = c.lighten(0.3).hex()",
              "      }",
              "    } catch {}",
              "  }",
              "",
              "  let background = (d.background as string) ?? fallback.background",
              "  let surface = (d.surface as string) ?? fallback.surface",
              "  let surfaceVariant = (d.surfaceVariant as string) ?? fallback.surfaceVariant",
              "  let elevation = fallback.elevation",
