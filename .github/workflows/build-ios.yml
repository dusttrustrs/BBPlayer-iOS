eFill}\n\t\t\t\tcontentFit='cover'\n\t\t\t\tcachePolicy='memory-disk'\n\t\t\t/>\n\t\t\t<View\n\t\t\t\tstyle={[StyleSheet.absoluteFill, { backgroundColor: scrimColor }]}\n\t\t\t/>\n\t\t</View>\n\t)\n})\n\nconst styles = StyleSheet.create({\n\tcontainer: {\n\t\tposition: 'absolute',\n\t\tleft: 0,\n\t\tright: 0,\n\t\tbottom: 0,\n\t\toverflow: 'hidden',\n\t},\n})\n\nexport default TabCustomBackground\n", "utf8");
