            '    public func setMuted(_ m: Bool) {',
            '        muted = m',
            '        player?.isMuted = m',
            '    }',
            '    public func setContentFit(_ fit: String) {',
            '        contentFit = fit',
            '        playerLayer?.videoGravity = (fit == "contain") ? .resizeAspect : .resizeAspectFill',
