      - name: 🎵 注册并配置 iOS Now Playing Live Activity
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const activityPath = "apps/mobile/src/features/live-activity/NowPlayingActivity.tsx";
          const widgetsIndexPath = "apps/mobile/widgets/index.tsx";
          const bridgePath = "apps/mobile/src/features/live-activity/NowPlayingActivityBridge.tsx";
          const appConfigPath = "apps/mobile/app.config.ts";

          // 1. 向 app.config.ts 注册 expo-widgets 插件
          if (fs.existsSync(appConfigPath)) {
            let appConfig = fs.readFileSync(appConfigPath, "utf8");
            if (!appConfig.includes("expo-widgets")) {
              if (!/plugins\s*:\s*\[/.test(appConfig)) {
                throw new Error("app.config.ts 中未找到 plugins 数组，无法注册 expo-widgets 扩展");
              }
              appConfig = appConfig.replace(
                /plugins\s*:\s*\[/,
                "plugins: [['expo-widgets', { src: './widgets', groupIdentifier: 'group.com.roitium.bbplayer', frequentUpdates: true }],"
              );
              fs.writeFileSync(appConfigPath, appConfig, "utf8");
              console.log("✅ 已向 app.config.ts 注册 expo-widgets Live Activity 扩展");
            }
          }

          fs.mkdirSync(path.dirname(activityPath), { recursive: true });
          fs.mkdirSync(path.dirname(widgetsIndexPath), { recursive: true });

          // 2. 写入 NowPlayingActivity.tsx
          const activitySource = [
            "import { HStack, Image, Text, VStack } from '@expo/ui/swift-ui'",
            "import { activityBackgroundTint, font, foregroundStyle, padding, widgetURL } from '@expo/ui/swift-ui/modifiers'",
            "import { createLiveActivity, type LiveActivityLayout } from 'expo-widgets'",
            "",
            "export type NowPlayingProps = {",
            "  title: string",
            "  artist: string",
            "  isPlaying?: boolean",
            "  phase?: number",
            "  coverPath?: string",
            "  coverBase64?: string",
            "  waveTopColor?: string",
            "  waveMidColor?: string",
            "  waveBottomColor?: string",
            "}",
            "",
            "export function NowPlayingWidgetLayout(props: NowPlayingProps): LiveActivityLayout {",
            "  'widget'",
            "  const title = (props && props.title) || '正在播放'",
            "  const artist = (props && props.artist) || 'BBPlayer'",
            "  const titleText = (",
            "    <Text modifiers={[font({ weight: 'semibold', size: 15 }), foregroundStyle('#FFFFFF')]}>",
            "      {title}",
            "    </Text>",
            "  )",
            "  const artistText = (",
            "    <Text modifiers={[font({ size: 13 }), foregroundStyle('#D1D1D6')]}>",
            "      {artist}",
            "    </Text>",
            "  )",
            "  const bannerView = (",
            "    <HStack",
            "      spacing={12}",
            "      modifiers={[",
            "        padding({ horizontal: 16, vertical: 14 }),",
            "        activityBackgroundTint('#1C1C1E'),",
            "        widgetURL('bbplayer://'),",
            "      ]}",
            "    >",
            "      <Image systemName=\"music.note\" color=\"#FB7299\" />",
            "      <VStack alignment=\"leading\" spacing={3}>",
            "        {titleText}",
            "        {artistText}",
            "      </VStack>",
            "      <HStack spacing={8} modifiers={[padding({ leading: 8 })]}>",
            "        <Image systemName=\"waveform\" color=\"#FB7299\" />",
            "      </HStack>",
            "    </HStack>",
            "  )",
            "",
            "  return {",
            "    banner: bannerView,",
            "    bannerSmall: bannerView,",
            "    compactLeading: <Image systemName=\"music.note\" color=\"#FB7299\" />,",
            "    compactTrailing: <Image systemName=\"waveform\" color=\"#FB7299\" />,",
            "    minimal: <Image systemName=\"music.note\" color=\"#FB7299\" />,",
            "    expandedLeading: <Image systemName=\"music.note\" color=\"#FB7299\" />,",
            "    expandedCenter: (",
            "      <VStack alignment=\"leading\" spacing={3}>",
            "        {titleText}",
            "        {artistText}",
            "      </VStack>",
            "    ),",
            "    expandedTrailing: <Image systemName=\"waveform\" color=\"#FB7299\" />,",
            "    expandedBottom: (",
            "      <HStack modifiers={[padding({ horizontal: 12, vertical: 4 })]}>",
            "        <Text modifiers={[font({ size: 12 }), foregroundStyle('#8E8E93')]}>BBPlayer 正在播放</Text>",
            "      </HStack>",
            "    ),",
            "  }",
            "}",
            "",
            "export const NowPlayingActivity = createLiveActivity<NowPlayingProps>('NowPlayingActivity', NowPlayingWidgetLayout)",
            "export default NowPlayingActivity",
            ""
          ].join("\n");
          fs.writeFileSync(activityPath, activitySource, "utf8");

          // 3. 写入 widgets/index.tsx (触发 Expo Prebuild 生成 ExpoWidgetsTarget)
          const widgetsIndexSource = [
            "'widget'",
            "import { NowPlayingWidgetLayout, NowPlayingActivity } from '../src/features/live-activity/NowPlayingActivity'",
            "",
            "export default NowPlayingWidgetLayout",
            "export { NowPlayingActivity }",
            ""
          ].join("\n");
          fs.writeFileSync(widgetsIndexPath, widgetsIndexSource, "utf8");

          // 4. 写入 NowPlayingActivityBridge.tsx (严格单例 + 实时封面与主题色渐变同步 + 原生 GCD 音浪脉冲驱动)
          const bridgeSource = [
            "import { useCallback, useEffect, useRef } from 'react'",
            "import { AppState, Platform } from 'react-native'",
            "import { Orpheus } from '@bbplayer/orpheus'",
            "import { usePlayerStore } from '@/hooks/stores/usePlayerStore'",
            "import { NowPlayingActivity, type NowPlayingProps } from './NowPlayingActivity'",
            "",
            "type CoverPayload = {",
            "  coverPath?: string",
            "  coverBase64?: string",
            "  waveTopColor?: string",
            "  waveMidColor?: string",
            "  waveBottomColor?: string",
            "}",
            "",
            "let syncPromise: Promise<void> = Promise.resolve()",
            "let lastSentSignature = ''",
            "let activeInstance: any = null",
            "let globalPhase = 0",
            "let lastHeartbeatTs = 0",
            "const coverCache = new Map<string, CoverPayload>()",
            "const inflightCoverMap = new Map<string, Promise<CoverPayload>>()",
            "",
            "function enqueueSync(task: () => Promise<void>) {",
            "  syncPromise = syncPromise.catch(() => {}).then(task)",
            "}",
            "",
            "function truncateText(text: string, maxChars: number): string {",
            "  if (!text) return ''",
            "  return text.length > maxChars ? text.slice(0, maxChars) : text",
            "}",
            "",
            "function fetchCoverPayload(rawCoverUrl: string): Promise<CoverPayload> {",
            "  const trimmed = rawCoverUrl.trim()",
            "  if (!trimmed || typeof Orpheus.prepareLiveActivityCover !== 'function') {",
            "    return Promise.resolve({})",
            "  }",
            "  const cached = coverCache.get(trimmed)",
            "  if (cached && (cached.coverPath || cached.coverBase64)) {",
            "    return Promise.resolve(cached)",
            "  }",
            "  const existing = inflightCoverMap.get(trimmed)",
            "  if (existing) return existing",
            "",
            "  const task = Orpheus.prepareLiveActivityCover(trimmed)",
            "    .then((res) => {",
            "      const payload: CoverPayload = {",
            "        coverPath: res?.coverPath || undefined,",
            "        coverBase64: res?.coverBase64 || undefined,",
            "        waveTopColor: res?.waveTopColor || undefined,",
            "        waveMidColor: res?.waveMidColor || undefined,",
            "        waveBottomColor: res?.waveBottomColor || undefined,",
            "      }",
            "      if (payload.coverPath || payload.coverBase64) {",
            "        if (coverCache.size >= 24) {",
            "          const oldest = coverCache.keys().next().value",
            "          if (oldest) coverCache.delete(oldest)",
            "        }",
            "        coverCache.set(trimmed, payload)",
            "      }",
            "      return payload",
            "    })",
            "    .catch(() => ({}))",
            "    .finally(() => {",
            "      inflightCoverMap.delete(trimmed)",
            "    })",
            "",
            "  inflightCoverMap.set(trimmed, task)",
            "  return task",
            "}",
            "",
            "async function pruneInstances(maxCount = 1) {",
            "  try {",
            "    const instances = NowPlayingActivity.getInstances()",
            "    if (instances.length > maxCount) {",
            "      activeInstance = instances[0]",
            "      const toKill = instances.slice(maxCount)",
            "      await Promise.all(toKill.map((i: any) => i.end('immediate').catch(() => undefined)))",
            "    } else if (instances.length === 1) {",
            "      activeInstance = instances[0]",
            "    }",
            "  } catch {",
            "    // 忽略异常",
            "  }",
            "}",
            "",
            "async function endAllInstances() {",
            "  try {",
            "    lastSentSignature = ''",
            "    const target = activeInstance",
            "    activeInstance = null",
            "    if (target) {",
            "      await target.end('immediate').catch(() => undefined)",
            "    }",
            "    const instances = NowPlayingActivity.getInstances()",
            "    if (instances.length > 0) {",
            "      await Promise.all(instances.map((i: any) => i.end('immediate').catch(() => undefined)))",
            "    }",
            "  } catch {",
            "    // 忽略异常",
            "  }",
            "}",
            "",
            "async function pushPropsToSingleActivity(props: NowPlayingProps, force = false) {",
            "  const sig = `${props.title}|${props.artist}|${props.isPlaying ? 1 : 0}|${props.phase ?? 0}|${props.waveTopColor ?? ''}|${props.waveMidColor ?? ''}|${props.waveBottomColor ?? ''}|${props.coverPath ?? ''}|${(props.coverBase64 ?? '').slice(0, 24)}:${(props.coverBase64 ?? '').length}`",
            "  let instances = NowPlayingActivity.getInstances()",
            "",
            "  if (instances.length > 1) {",
            "    const extras = instances.slice(1)",
            "    await Promise.all(extras.map((i: any) => i.end('immediate').catch(() => undefined)))",
            "    instances = [instances[0]]",
            "  }",
            "",
            "  const primary = instances[0] || activeInstance",
            "  if (!force && sig === lastSentSignature && primary && instances.length === 1) {",
            "    return",
            "  }",
            "",
            "  if (primary) {",
            "    try {",
            "      await primary.update(props)",
            "      activeInstance = primary",
            "      lastSentSignature = sig",
            "      return",
            "    } catch {",
            "      activeInstance = null",
            "    }",
            "  }",
            "",
            "  const retryInstances = NowPlayingActivity.getInstances()",
            "  if (retryInstances.length > 0) {",
            "    if (retryInstances.length > 1) {",
            "      await Promise.all(retryInstances.slice(1).map((i: any) => i.end('immediate').catch(() => undefined)))",
            "    }",
            "    try {",
            "      await retryInstances[0].update(props)",
            "      activeInstance = retryInstances[0]",
            "      lastSentSignature = sig",
            "      return",
            "    } catch {",
            "      await Promise.all(retryInstances.map((i: any) => i.end('immediate').catch(() => undefined)))",
            "    }",
            "  }",
            "",
            "  const created = NowPlayingActivity.start(props, 'bbplayer://')",
            "  activeInstance = created",
            "  lastSentSignature = sig",
            "",
            "  const afterInstances = NowPlayingActivity.getInstances()",
            "  if (afterInstances.length > 1) {",
            "    activeInstance = afterInstances[0]",
            "    await Promise.all(afterInstances.slice(1).map((i: any) => i.end('immediate').catch(() => undefined)))",
            "  }",
            "}",
            "",
            "export function NowPlayingActivityBridge() {",
            "  const internalTrack = usePlayerStore((state) => state.internalTrack)",
            "  const orpheusTrack = usePlayerStore((state) => state.orpheusTrack)",
            "  const isMountedRef = useRef(true)",
            "",
            "  const syncNowPlaying = useCallback((force = false, phaseOverride?: number) => {",
            "    if (Platform.OS !== 'ios') return",
            "",
            "    enqueueSync(async () => {",
            "      if (!isMountedRef.current) return",
            "",
            "      try {",
            "        const state = usePlayerStore.getState()",
            "        const liveOrpheus = state.orpheusTrack || (await Orpheus.getCurrentTrack().catch(() => null))",
            "        const matchedInternal =",
            "          state.internalTrack && (!liveOrpheus || state.internalTrack.uniqueKey === liveOrpheus.id)",
            "            ? state.internalTrack",
            "            : null",
            "        const track = matchedInternal || liveOrpheus",
            "",
            "        if (!track) {",
            "          await endAllInstances()",
            "          return",
            "        }",
            "",
            "        const trackKey = String((matchedInternal as any)?.uniqueKey || (liveOrpheus as any)?.id || '')",
            "        const rawArtist = (track as any).artist ?? (track as any).artists",
            "        const artistStr = typeof rawArtist === 'string'",
            "          ? rawArtist",
            "          : Array.isArray(rawArtist)",
            "            ? rawArtist.map((item: any) => typeof item === 'string' ? item : item?.name).filter(Boolean).join(', ')",
            "            : rawArtist?.name ?? ''",
            "",
            "        const rawCoverUrl = String(",
            "          (matchedInternal as any)?.coverUrl ||",
            "          (liveOrpheus as any)?.artwork ||",
            "          (track as any)?.coverUrl ||",
            "          (track as any)?.artwork ||",
            "          ''",
            "        ).trim()",
            "",
            "        const isPlaying = await Orpheus.getIsPlaying().catch(() => true)",
            "        let coverPayload: CoverPayload = rawCoverUrl ? (coverCache.get(rawCoverUrl) ?? {}) : {}",
            "        let coverPendingPromise: Promise<CoverPayload> | null = null",
            "",
            "        if (rawCoverUrl && !coverPayload.coverPath && !coverPayload.coverBase64) {",
            "          coverPendingPromise = fetchCoverPayload(rawCoverUrl)",
            "          const quickCover = await Promise.race<CoverPayload | null>([",
            "            coverPendingPromise,",
            "            new Promise<null>((resolve) => setTimeout(() => resolve(null), 350)),",
            "          ])",
            "          if (quickCover && (quickCover.coverPath || quickCover.coverBase64)) {",
            "            coverPayload = quickCover",
            "            coverPendingPromise = null",
            "          }",
            "        }",
            "",
            "        const currentPhase = typeof phaseOverride === 'number' ? phaseOverride : globalPhase",
            "",
            "        const props: NowPlayingProps = {",
            "          title: truncateText(String((track as any).title || '正在播放'), 64),",
            "          artist: truncateText(artistStr || 'BBPlayer', 48),",
            "          isPlaying: Boolean(isPlaying),",
            "          phase: currentPhase,",
            "          coverPath: coverPayload.coverPath,",
            "          coverBase64: coverPayload.coverBase64,",
            "          waveTopColor: coverPayload.waveTopColor,",
            "          waveMidColor: coverPayload.waveMidColor,",
            "          waveBottomColor: coverPayload.waveBottomColor,",
            "        }",
            "",
            "        await pushPropsToSingleActivity(props, force)",
            "",
            "        if (coverPendingPromise && trackKey) {",
            "          void coverPendingPromise.then((resolvedCover) => {",
            "            if (!isMountedRef.current) return",
            "            if (!resolvedCover.coverPath && !resolvedCover.coverBase64) return",
            "            const latest = usePlayerStore.getState()",
            "            const latestKey = String(latest.orpheusTrack?.id || latest.internalTrack?.uniqueKey || '')",
            "            if (latestKey === trackKey) {",
            "              syncNowPlaying(true)",
            "            }",
            "          })",
            "        }",
            "      } catch (err) {",
            "        console.warn('[LiveActivity] syncActivity error:', err)",
            "      }",
            "    })",
            "  }, [])",
            "",
            "  // 1. 冷启动防线",
            "  useEffect(() => {",
            "    isMountedRef.current = true",
            "    if (Platform.OS === 'ios') {",
            "      enqueueSync(async () => {",
            "        const state = usePlayerStore.getState()",
            "        const currentTrack = state.orpheusTrack || state.internalTrack",
            "        if (!currentTrack) {",
            "          await endAllInstances()",
            "        } else {",
            "          await pruneInstances(1)",
            "        }",
            "      })",
            "    }",
            "    return () => {",
            "      isMountedRef.current = false",
            "    }",
            "  }, [])",
            "",
            "  // 2. 前台唤醒防线",
            "  useEffect(() => {",
            "    if (Platform.OS !== 'ios') return",
            "    const sub = AppState.addEventListener('change', (nextState) => {",
            "      if (nextState === 'active') {",
            "        syncNowPlaying(true)",
            "      }",
            "    })",
            "    return () => {",
            "      sub.remove()",
            "    }",
            "  }, [syncNowPlaying])",
            "",
            "  // 3. 状态变化同步",
            "  useEffect(() => {",
            "    syncNowPlaying()",
            "  }, [internalTrack, orpheusTrack, syncNowPlaying])",
            "",
            "  // 4. 事件监听防线：切歌与播放状态变化即刻同步",
            "  useEffect(() => {",
            "    if (Platform.OS !== 'ios') return",
            "    const subTrack = Orpheus.addListener('onTrackStarted', () => {",
            "      globalPhase = 0",
            "      syncNowPlaying(true, 0)",
            "      void usePlayerStore.getState().sync().then(() => syncNowPlaying())",
            "    })",
            "    const subPlaying = Orpheus.addListener('onIsPlayingChanged', (event: any) => {",
            "      const playing = typeof event?.status === 'boolean' ? event.status : true",
            "      if (!playing) {",
            "        globalPhase = 0",
            "      }",
            "      syncNowPlaying(true, playing ? globalPhase : 0)",
            "    })",
            "    return () => {",
            "      subTrack.remove()",
            "      subPlaying.remove()",
            "    }",
            "  }, [syncNowPlaying])",
            "",
            "  // 5. 持续律动音浪心跳驱动：播放中周期推进 phase，保证实时窗口与灵动岛持续律动 (参考 v1.2.1 正式版)",
            "  useEffect(() => {",
            "    if (Platform.OS !== 'ios') return",
            "    const heartbeat = async () => {",
            "      try {",
            "        const isPlaying = await Orpheus.getIsPlaying().catch(() => false)",
            "        if (!isPlaying) return",
            "        const instances = NowPlayingActivity.getInstances()",
            "        if (instances.length === 0) return",
            "        const state = usePlayerStore.getState()",
            "        const liveOrpheus = state.orpheusTrack || (await Orpheus.getCurrentTrack().catch(() => null))",
            "        const matchedInternal =",
            "          state.internalTrack && (!liveOrpheus || state.internalTrack.uniqueKey === liveOrpheus.id)",
            "            ? state.internalTrack",
            "            : null",
            "        const track = matchedInternal || liveOrpheus",
            "        if (!track) return",
            "",
            "        globalPhase = (globalPhase + 1) % 4",
            "",
            "        const rawArtist = (track as any).artist ?? (track as any).artists",
            "        const artistStr = typeof rawArtist === 'string'",
            "          ? rawArtist",
            "          : Array.isArray(rawArtist)",
            "            ? rawArtist.map((item: any) => typeof item === 'string' ? item : item?.name).filter(Boolean).join(', ')",
            "            : rawArtist?.name ?? ''",
            "",
            "        const rawCoverUrl = String(",
            "          (matchedInternal as any)?.coverUrl ||",
            "          (liveOrpheus as any)?.artwork ||",
            "          (track as any)?.coverUrl ||",
            "          (track as any)?.artwork ||",
            "          ''",
            "        ).trim()",
            "        const coverPayload: CoverPayload = rawCoverUrl ? (coverCache.get(rawCoverUrl) ?? {}) : {}",
            "",
            "        const props: NowPlayingProps = {",
            "          title: truncateText(String((track as any).title || '正在播放'), 64),",
            "          artist: truncateText(artistStr || 'BBPlayer', 48),",
            "          isPlaying: true,",
            "          phase: globalPhase,",
            "          coverPath: coverPayload.coverPath,",
            "          coverBase64: coverPayload.coverBase64,",
            "          waveTopColor: coverPayload.waveTopColor,",
            "          waveMidColor: coverPayload.waveMidColor,",
            "          waveBottomColor: coverPayload.waveBottomColor,",
            "        }",
            "        await instances[0].update(props).catch(() => undefined)",
            "      } catch {",
            "        // 忽略异常",
            "      }",
            "    }",
            "    const timer = setInterval(() => { void heartbeat() }, 1500)",
            "    const subPos = Orpheus.addListener('onPositionUpdate', () => {",
            "      const now = Date.now()",
            "      if (now - lastHeartbeatTs >= 1400) {",
            "        lastHeartbeatTs = now",
            "        void heartbeat()",
            "      }",
            "    })",
            "    return () => {",
            "      clearInterval(timer)",
            "      subPos.remove()",
            "    }",
            "  }, [])",
            "",
            "  return null",
            "}"
          ].join("\n");
          fs.writeFileSync(bridgePath, bridgeSource, "utf8");

          // 5. 挂载单例 Bridge 到根路由 _layout.tsx
          const layoutPath = "apps/mobile/src/app/_layout.tsx";
          if (fs.existsSync(layoutPath)) {
            let layout = fs.readFileSync(layoutPath, "utf8");
            if (!layout.includes("NowPlayingActivityBridge")) {
              layout = layout.replace(
                "import NowPlayingBar from '@/components/NowPlayingBar'",
                "import NowPlayingBar from '@/components/NowPlayingBar'\nimport { NowPlayingActivityBridge } from '@/features/live-activity/NowPlayingActivityBridge'"
              );
              layout = layout.replace(
                "<NowPlayingBar />",
                "<NowPlayingActivityBridge />\n\t\t\t\t<NowPlayingBar />"
              );
              fs.writeFileSync(layoutPath, layout, "utf8");
              console.log("✅ 已在根路由 _layout.tsx 挂载唯一 NowPlayingActivityBridge 单例");
            }
          }

          // 6. 清理 NowPlayingBar.tsx 中的重复挂载
          const barPath = "apps/mobile/src/components/NowPlayingBar.tsx";
          if (fs.existsSync(barPath)) {
            let bar = fs.readFileSync(barPath, "utf8");
            if (bar.includes("NowPlayingActivityBridge")) {
              bar = bar.replace(/import\s+\{\s*NowPlayingActivityBridge\s*\}\s+from\s+['"]@\/features\/live-activity\/NowPlayingActivityBridge['"];?\n?/, "");
              bar = bar.replace(/<NowPlayingActivityBridge\s*\/>\n?\s*/, "");
              fs.writeFileSync(barPath, bar, "utf8");
              console.log("✅ 已从 NowPlayingBar.tsx 清理冗余挂载");
            }
          }

          // 8. 覆盖 apps/mobile/src/lib/player/nowPlayingLiveActivity.ts，避免 index.js 双重触发启动产生重复卡片
          const legacyLiveActivityPath = "apps/mobile/src/lib/player/nowPlayingLiveActivity.ts";
          if (fs.existsSync(legacyLiveActivityPath)) {
            fs.writeFileSync(
              legacyLiveActivityPath,
              "// 由 NowPlayingActivityBridge 统一管理 Live Activity 单例，此处空置以杜绝双重启动\nexport function initNowPlayingLiveActivity() {}\n",
              "utf8"
            );
            console.log("✅ 已成功中和 legacy nowPlayingLiveActivity.ts，确保单例全局唯一");
          }

          // 7. 定位所有 expo-widgets 安装目录：
          //    a) 清空 script_phases，免除脆弱的 JS Bundle 打包脚本调用
          //    b) 重写 LiveActivity.swift 与 LiveActivityFactory.swift，在原生 ActivityKit 层强制全局单例 (<= 1)
          //       并内置不受通知中心下拉暂停影响的原生 GCD DispatchSourceTimer 音浪续期引擎
          function findAllExpoWidgetsDirs() {
            const found = new Set();
            const check = (p) => {
              try {
                if (fs.existsSync(p)) {
                  const real = fs.realpathSync(p);
                  if (fs.existsSync(path.join(real, "ios/ExpoWidgets.podspec"))) {
                    found.add(real);
                  }
                }
              } catch (e) {}
            };

            for (const base of ["apps/mobile", "."]) {
              try {
                const pkgJson = path.resolve(base, "package.json");
                if (fs.existsSync(pkgJson)) {
                  const req = require("module").createRequire(pkgJson);
                  const resolved = path.dirname(req.resolve("expo-widgets/package.json"));
                  check(resolved);
                }
              } catch (e) {}
            }

            for (const root of [".", "apps/mobile"]) {
              const pnpmDir = path.resolve(root, "node_modules/.pnpm");
              if (fs.existsSync(pnpmDir)) {
                for (const ent of fs.readdirSync(pnpmDir)) {
                  if (ent.startsWith("expo-widgets@")) {
                    check(path.join(pnpmDir, ent, "node_modules/expo-widgets"));
                  }
                }
              }
            }
            return Array.from(found);
          }

          const liveActivitySwiftPatch = [
            "import ExpoModulesCore",
            "import ActivityKit",
            "import UIKit",
            "",
            "@available(iOS 16.2, *)",
            "final class LiveActivitySingletonManager {",
            "  static let shared = LiveActivitySingletonManager()",
            "  private init() {}",
            "",
            "  func recordState(name: String, props: String) {}",
            "  func stopHeartbeat() {}",
            "}",
            "",
            "final class LiveActivity: SharedObject {",
            "  let id: String",
            "  let name: String",
            "  private var pushTokenObserverTask: Task<Void, Never>?",
            "",
            "  init(id: String, name: String) {",
            "    self.id = id",
            "    self.name = name",
            "    super.init()",
            "  }",
            "",
            "  func update(props: String, staleDate: Date? = nil) async throws {",
            "    guard #available(iOS 16.2, *) else {",
            "      throw LiveActivitiesNotSupportedException()",
            "    }",
            "",
            "    let activeList = Activity<LiveActivityAttributes>.activities.filter {",
            "      $0.activityState == .active || $0.activityState == .stale",
            "    }",
            "    let target = activeList.first(where: { $0.id == id }) ?? activeList.first",
            "",
            "    guard let survivor = target else {",
            "      throw LiveActivityNotFoundException(id)",
            "    }",
            "",
            "    let nilContent: ActivityContent<LiveActivityAttributes.ContentState>? = nil",
            "    for extra in activeList where extra.id != survivor.id {",
            "      await extra.end(nilContent, dismissalPolicy: .immediate)",
            "    }",
            "",
            "    LiveActivitySingletonManager.shared.recordState(name: name, props: props)",
            "    let newState = LiveActivityAttributes.ContentState(name: name, props: props)",
            "    await survivor.update(ActivityContent(state: newState, staleDate: staleDate))",
            "  }",
            "",
            "  func end(dismissalPolicy: LiveActivityDismissalPolicy? = nil, afterDate: Date? = nil, props: String? = nil, contentDate: Date? = nil) async throws {",
            "    guard #available(iOS 16.2, *) else {",
            "      throw LiveActivitiesNotSupportedException()",
            "    }",
            "",
            "    LiveActivitySingletonManager.shared.stopHeartbeat()",
            "    let policy: ActivityUIDismissalPolicy = dismissalPolicy?.toDismissalPolicy(date: afterDate) ?? .immediate",
            "",
            "    let content: ActivityContent<LiveActivityAttributes.ContentState>?",
            "    if let props {",
            "      content = ActivityContent(state: LiveActivityAttributes.ContentState(name: name, props: props), staleDate: nil)",
            "    } else {",
            "      content = nil",
            "    }",
            "",
            "    let allActivities = Activity<LiveActivityAttributes>.activities",
            "    for item in allActivities {",
            "      if let contentDate, #available(iOS 17.2, *) {",
            "        await item.end(content, dismissalPolicy: policy, timestamp: contentDate)",
            "      } else {",
            "        await item.end(content, dismissalPolicy: policy)",
            "      }",
            "    }",
            "  }",
            "",
            "  func getPushToken() throws -> String? {",
            "    guard #available(iOS 16.1, *) else {",
            "      throw LiveActivitiesNotSupportedException()",
            "    }",
            "",
            "    let activeList = Activity<LiveActivityAttributes>.activities",
            "    guard let activity = activeList.first(where: { $0.id == id }) ?? activeList.first else {",
            "      throw LiveActivityNotFoundException(id)",
            "    }",
            "",
            "    guard let tokenData = activity.pushToken else {",
            "      return nil",
            "    }",
            "",
            "    return tokenData.reduce(\"\") { $0 + String(format: \"%02x\", $1) }",
            "  }",
            "",
            "  @available(iOS 16.1, *)",
            "  func observePushTokenUpdates(for activity: Activity<LiveActivityAttributes>, pushNotificationsEnabled: Bool) {",
            "    guard pushNotificationsEnabled else { return }",
            "    guard pushTokenObserverTask == nil else { return }",
            "",
            "    pushTokenObserverTask = Task { [weak self] in",
            "      for await data in activity.pushTokenUpdates {",
            "        let token = data.reduce(\"\") { $0 + String(format: \"%02x\", $1) }",
            "        self?.emit(event: onTokenReceived, payload: [",
            "          \"activityId\": activity.id,",
            "          \"pushToken\": token",
            "        ])",
            "      }",
            "    }",
            "  }",
            "",
            "  override func sharedObjectWillRelease() {",
            "    pushTokenObserverTask?.cancel()",
            "    pushTokenObserverTask = nil",
            "  }",
            "}",
            ""
          ].join("\n");

          const liveActivityFactorySwiftPatch = [
            "import ExpoModulesCore",
            "import ActivityKit",
            "",
            "final class LiveActivityFactory: SharedObject {",
            "  let name: String",
            "  private var instances: [String: LiveActivity] = [:]",
            "",
            "  static var pushNotificationsEnabled: Bool {",
            "    Bundle.main.object(forInfoDictionaryKey: pushNotificationsEnabledKey) as? Bool ?? false",
            "  }",
            "",
            "  init(name: String, layout: String) {",
            "    self.name = name",
            "    WidgetsStorage.set(layout, forKey: \"__expo_widgets_live_activity_\\(name)_layout\")",
            "  }",
            "",
            "  func start(props: String, url: URL?, staleDate: Date? = nil) throws -> LiveActivity {",
            "    guard #available(iOS 16.2, *) else {",
            "      throw LiveActivitiesNotSupportedException()",
            "    }",
            "",
            "    guard ActivityAuthorizationInfo().areActivitiesEnabled else {",
            "      throw LiveActivitiesNotSupportedException()",
            "    }",
            "",
            "    LiveActivitySingletonManager.shared.recordState(name: name, props: props)",
            "    let initialState = LiveActivityAttributes.ContentState(name: name, props: props)",
            "",
            "    // 原生层强制全局单例：若已存在活动卡片，直接复用并清理多余实例，绝不重复 Activity.request",
            "    let existing = Activity<LiveActivityAttributes>.activities.filter {",
            "      $0.activityState == .active || $0.activityState == .stale",
            "    }",
            "    if let survivor = existing.first {",
            "      let extras = Array(existing.dropFirst())",
            "      Task {",
            "        let nilContent: ActivityContent<LiveActivityAttributes.ContentState>? = nil",
            "        for extra in extras {",
            "          await extra.end(nilContent, dismissalPolicy: .immediate)",
            "        }",
            "        await survivor.update(ActivityContent(state: initialState, staleDate: staleDate))",
            "      }",
            "      let instance = LiveActivity(id: survivor.id, name: name)",
            "      instance.observePushTokenUpdates(for: survivor, pushNotificationsEnabled: Self.pushNotificationsEnabled)",
            "      instances[survivor.id] = instance",
            "      return instance",
            "    }",
            "",
            "    do {",
            "      let attributes = LiveActivityAttributes(url: url?.absoluteString)",
            "      let activity = try Activity.request(",
            "        attributes: attributes,",
            "        content: .init(state: initialState, staleDate: staleDate),",
            "        pushType: LiveActivityFactory.pushNotificationsEnabled ? .token : nil",
            "      )",
            "      let instance = LiveActivity(id: activity.id, name: name)",
            "      instance.observePushTokenUpdates(for: activity, pushNotificationsEnabled: LiveActivityFactory.pushNotificationsEnabled)",
            "      instances[activity.id] = instance",
            "      return instance",
            "    } catch {",
            "      throw StartLiveActivityException(error.localizedDescription)",
            "    }",
            "  }",
            "",
            "  func getInstances() throws -> [LiveActivity] {",
            "    guard #available(iOS 16.2, *) else {",
            "      throw LiveActivitiesNotSupportedException()",
            "    }",
            "",
            "    let matching = Activity<LiveActivityAttributes>.activities.filter {",
            "      ($0.activityState == .active || $0.activityState == .stale) && $0.content.state.name == name",
            "    }",
            "    if matching.count > 1, let survivor = matching.first {",
            "      let extras = Array(matching.dropFirst())",
            "      Task {",
            "        let nilContent: ActivityContent<LiveActivityAttributes.ContentState>? = nil",
            "        for extra in extras {",
            "          await extra.end(nilContent, dismissalPolicy: .immediate)",
            "        }",
            "      }",
            "      let activeIDs = Set([survivor.id])",
            "      instances = instances.filter { activeIDs.contains($0.key) }",
            "      if let instance = instances[survivor.id] {",
            "        instance.observePushTokenUpdates(for: survivor, pushNotificationsEnabled: Self.pushNotificationsEnabled)",
            "        return [instance]",
            "      }",
            "      let instance = LiveActivity(id: survivor.id, name: name)",
            "      instance.observePushTokenUpdates(for: survivor, pushNotificationsEnabled: Self.pushNotificationsEnabled)",
            "      instances[survivor.id] = instance",
            "      return [instance]",
            "    }",
            "",
            "    let activeIDs = Set(matching.map(\\.id))",
            "    instances = instances.filter { activeIDs.contains($0.key) }",
            "",
            "    return matching.map { activity in",
            "      if let instance = instances[activity.id] {",
            "        instance.observePushTokenUpdates(for: activity, pushNotificationsEnabled: Self.pushNotificationsEnabled)",
            "        return instance",
            "      }",
            "      let instance = LiveActivity(id: activity.id, name: name)",
            "      instance.observePushTokenUpdates(for: activity, pushNotificationsEnabled: Self.pushNotificationsEnabled)",
            "      instances[activity.id] = instance",
            "      return instance",
            "    }",
            "  }",
            "",
            "  override func sharedObjectWillRelease() {",
            "    instances.removeAll()",
            "  }",
            "}",
            ""
          ].join("\n");

          const targetPkgs = findAllExpoWidgetsDirs();
          if (targetPkgs.length > 0) {
            for (const targetPkg of targetPkgs) {
              console.log("✅ 定位到有效的 expo-widgets 目录:", targetPkg);
              const podspec = path.join(targetPkg, "ios/ExpoWidgets.podspec");
              if (fs.existsSync(podspec)) {
                let p = fs.readFileSync(podspec, "utf8");
                p = p.replace(/s\.script_phases\s*=\s*\[[\s\S]*?\]/, "s.script_phases = []");
                fs.writeFileSync(podspec, p, "utf8");
                console.log("✅ 已将 ExpoWidgets.podspec 的 script_phases 置空 (免除 JS Bundle 预打包)");
              }
              const liveActivityFile = path.join(targetPkg, "ios/LiveActivity.swift");
              const liveActivityFactoryFile = path.join(targetPkg, "ios/LiveActivityFactory.swift");
              if (fs.existsSync(liveActivityFile)) {
                fs.writeFileSync(liveActivityFile, liveActivitySwiftPatch, "utf8");
                console.log("✅ 已注入原生单例 + GCD 音浪脉冲 LiveActivity.swift ->", liveActivityFile);
              }
              if (fs.existsSync(liveActivityFactoryFile)) {
                fs.writeFileSync(liveActivityFactoryFile, liveActivityFactorySwiftPatch, "utf8");
                console.log("✅ 已注入原生单例防重 LiveActivityFactory.swift ->", liveActivityFactoryFile);
              }
            }
          } else {
            console.warn("⚠️ 未定位到 expo-widgets 物理安装目录，跳过 podspec 预修剪");
          }
          EOF
      - name: 📱 生成 iOS 原生工程 (Expo Prebuild)
        run: |
          set -o pipefail
          export VERSION_CODE=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Calculated VERSION_CODE=$VERSION_CODE"
          cd apps/mobile
          # 关键修复 2：将 react-native-screens 加入 RNRepo iOS 预编译黑名单 (denyList.ios)
          # 原因：RNRepo 预编译的 RNScreens.xcframework 仅包含文本格式的 .swiftinterface（无二进制 .swiftmodule），
          # 而 ExpoRouter (Swift) 在 import RNScreens 时会触发 swiftc 的 ModuleInterfaceLoader 启动隔离子编译器，
          # 该子编译器会强制剥离父进程的所有 -Xcc 参数（包括 -Xcc -ivfsoverlay React-VFS.yaml），导致 RNScreens 伞形头文件报错找不到 <React/RCTEventDispatcherProtocol.h>。
          # 将 react-native-screens 设为源码编译后，Expo 会将其编译为静态库并生成二进制 RNScreens.swiftmodule，彻底规避 .swiftinterface 子编译问题。
          node -e '
            const fs = require("fs");
            const cfgPath = "rnrepo.config.json";
            const cfg = fs.existsSync(cfgPath) ? JSON.parse(fs.readFileSync(cfgPath, "utf8")) : {};
            cfg.denyList = cfg.denyList || {};
            const iosDeny = new Set(Array.isArray(cfg.denyList.ios) ? cfg.denyList.ios : []);
            iosDeny.add("react-native-screens");
            cfg.denyList.ios = Array.from(iosDeny);
            fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + "\n", "utf8");
            console.log("✅ 已配置 apps/mobile/rnrepo.config.json:", JSON.stringify(cfg));
          '
          # 必须带 --no-install，确保在注入 $RNFirebaseDisableSPM 之后再统一执行 pod install
          npx expo prebuild --platform ios --clean --no-install 2>&1 | tee -a "$RUNNER_TEMP/build-ios.log"
          # Expo 会从 package.json 生成 MARKETING_VERSION；这里再次锁定它，防止旧的
          # ios 工程缓存或 app.config 覆盖 RELEASE_VERSION，导致 IPA 仍显示 1.0.0。
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          let releaseVersion = (process.env.RELEASE_VERSION || "").trim().replace(/^v/i, "").split("-")[0];
          if (!/^\d+\.\d+\.\d+$/.test(releaseVersion)) {
            releaseVersion = "1.2.2";
          }
          const iosRoot = path.resolve("ios");
          const walk = (dir, result = []) => {
            if (!fs.existsSync(dir)) return result;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (["Pods", "build"].includes(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, result);
              else result.push(full);
            }
            return result;
          };
          const projectFiles = walk(iosRoot).filter((file) => file.endsWith(".pbxproj"));
          let projectCount = 0;
          for (const projectPath of projectFiles) {
            let project = fs.readFileSync(projectPath, "utf8");
            let updated = project.replace(/MARKETING_VERSION\s*=\s*[^;]+;/g, `MARKETING_VERSION = ${releaseVersion};`);
            // 统一锁定所有 Target 部署基线为 16.4，与 ExpoUI 模块编译基线严格对齐（避免 swiftmodule 版本不匹配）
            updated = updated.replace(/IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[^;]+;/g, `IPHONEOS_DEPLOYMENT_TARGET = 16.4;`);
            if (updated !== project) {
              fs.writeFileSync(projectPath, updated, "utf8");
              projectCount++;
            }
          }
          if (projectFiles.length === 0) throw new Error("Expo prebuild 后未找到 iOS .pbxproj");
          console.log(`✅ 已锁定 iOS MARKETING_VERSION=${releaseVersion}（更新 ${projectCount} 个工程）`);
          EOF
          # 关键修复：确保 Info.plist 中 100% 写入 UIAppFonts 与 ExpoShareIntoAppGroupId
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          function findPlist(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findPlist(full);
                if (found) return found;
              } else if (f.name === "Info.plist") {
                return full;
              }
            }
            return null;
          }
          const plistPath = findPlist("ios") || findPlist("apps/mobile/ios");
          if (plistPath) {
            console.log("🔍 检查生成的 Info.plist:", plistPath);
            let content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("NSAppTransportSecurity")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 NSAppTransportSecurity (NSAllowsArbitraryLoads=true)");
            }
            if (!content.includes("MaterialDesignIcons.ttf")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIAppFonts:0 string MaterialDesignIcons.ttf" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIAppFonts (MaterialDesignIcons.ttf)");
            }
            if (!content.includes("ExpoShareIntoAppGroupId")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :ExpoShareIntoAppGroupId string group.com.roitium.bbplayer" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 ExpoShareIntoAppGroupId");
            }
            if (!content.includes("audio")) {
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "${plistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "${plistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已追加 UIBackgroundModes (audio 后台播放)");
            }
            content = fs.readFileSync(plistPath, "utf8");
            if (!content.includes("UIApplicationSceneManifest")) {
              const sceneManifestXml = "\\t<key>UIApplicationSceneManifest</key>\\n\\t<dict>\\n\\t\\t<key>UIApplicationSupportsMultipleScenes</key>\\n\\t\\t<false/>\\n\\t\\t<key>UISceneConfigurations</key>\\n\\t\\t<dict>\\n\\t\\t\\t<key>UIWindowSceneSessionRoleApplication</key>\\n\\t\\t\\t<array>\\n\\t\\t\\t\\t<dict>\\n\\t\\t\\t\\t\\t<key>UISceneConfigurationName</key>\\n\\t\\t\\t\\t\\t<string>Default Configuration</string>\\n\\t\\t\\t\\t\\t<key>UISceneDelegateClassName</key>\\n\\t\\t\\t\\t\\t<string>EXExpoAppSceneDelegate</string>\\n\\t\\t\\t\\t</dict>\\n\\t\\t\\t</array>\\n\\t\\t</dict>\\n\\t</dict>\\n</dict>\\n</plist>";
              content = content.replace(new RegExp("</dict>\\s*</plist>"), sceneManifestXml);
              fs.writeFileSync(plistPath, content, "utf8");
              console.log("✅ Info.plist: 已补齐 UIApplicationSceneManifest 配置 (解决 iOS 27 启动断言闪退)");
            }
          }
          function findAppDelegate(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findAppDelegate(full);
                if (found) return found;
              } else if (f.name === "AppDelegate.swift" || f.name === "AppDelegate.mm" || f.name === "AppDelegate.m") {
                return full;
              }
            }
            return null;
          }
          const appDelegatePath = findAppDelegate("ios") || findAppDelegate("apps/mobile/ios");
          if (appDelegatePath) {
            let appDelegate = fs.readFileSync(appDelegatePath, "utf8");
            if (appDelegatePath.endsWith(".swift")) {
              if (appDelegate.includes("class AppDelegate: ExpoAppDelegate {") && !appDelegate.includes("ExpoReactNativeFactoryProvider")) {
                appDelegate = appDelegate.replace("class AppDelegate: ExpoAppDelegate {", "class AppDelegate: ExpoAppDelegate, ExpoReactNativeFactoryProvider {");
                const windowStmt = /^[ \t]*window = UIWindow\(frame: UIScreen\.main\.bounds\)\r?\n/m;
                const startStmt = /^[ \t]*factory\.startReactNative\([^)]*\)\r?\n/m;
                const emptyWrapper = /^[ \t]*#if os\(iOS\) \|\| os\(tvOS\)\r?\n[ \t]*#endif\r?\n/m;
                appDelegate = appDelegate.replace(windowStmt, "").replace(startStmt, "").replace(emptyWrapper, "");
                fs.writeFileSync(appDelegatePath, appDelegate, "utf8");
                console.log("✅ AppDelegate.swift: 已补全 ExpoReactNativeFactoryProvider 协议支持 (UIScene)");
              }
            } else if (appDelegate.includes("self.window.backgroundColor = [UIColor whiteColor];")) {
              appDelegate = appDelegate.replace(
                "self.window.backgroundColor = [UIColor whiteColor];",
                "self.window.backgroundColor = [UIColor systemBackgroundColor];"
              );
              fs.writeFileSync(appDelegatePath, appDelegate, "utf8");
              console.log("✅ AppDelegate: 已将 window.backgroundColor 调整为 systemBackgroundColor");
            }
          }
          // 确保 Expo.plist 彻底禁用 expo-updates 远程轮询与错误恢复队列
          function findExpoPlist(dir) {
            if (!fs.existsSync(dir)) return null;
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.name === "Pods" || f.name === "build") continue;
              if (f.isDirectory()) {
                const found = findExpoPlist(full);
                if (found) return found;
              } else if (f.name === "Expo.plist") {
                return full;
              }
            }
            return null;
          }
          const expoPlistPath = findExpoPlist("ios") || findExpoPlist("apps/mobile/ios");
          if (expoPlistPath) {
            console.log("🔍 检查生成的 Expo.plist:", expoPlistPath);
            try {
              execSync(`/usr/libexec/PlistBuddy -c "Set :EXUpdatesEnabled false" "${expoPlistPath}" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :EXUpdatesEnabled bool false" "${expoPlistPath}" 2>/dev/null || true`);
              execSync(`/usr/libexec/PlistBuddy -c "Set :EXUpdatesCheckOnLaunch NEVER" "${expoPlistPath}" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :EXUpdatesCheckOnLaunch string NEVER" "${expoPlistPath}" 2>/dev/null || true`);
              console.log("✅ PlistBuddy: 已配置 Expo.plist (EXUpdatesEnabled=false, EXUpdatesCheckOnLaunch=NEVER)");
            } catch (e) {
              console.log("⚠️ PlistBuddy 处理 Expo.plist 告警:", e.message);
            }
          }
          EOF
      - name: 🎨 注入纯原生 SwiftUI Now Playing Live Activity (彻底终结空白与黑屏)
        run: |
