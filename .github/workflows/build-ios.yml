      - name: 📥 安装依赖
        env:
          LEFTHOOK: '0' # 跳过 Git Hook 安装
        run: |
          pnpm install --no-frozen-lockfile
      - name: 🩹 修复 ExpoOrpheus 在 iOS 26 SDK / Swift 6.3 下的编译错误
        run: |
          node << 'EOF'
          const fs = require("fs");
          // 1. 修复 AudioSpectrumAnalyzer.swift：
          // iOS 26 SDK 为 MTAudioProcessingTapCreate 添加了 CF_RETURNS_RETAINED 注解，
          // 第 4 个参数从 UnsafeMutablePointer<Unmanaged<MTAudioProcessingTap>?> 变为 UnsafeMutablePointer<MTAudioProcessingTap?>
          const analyzerPath = "packages/orpheus/ios/AudioSpectrumAnalyzer.swift";
          let analyzer = fs.readFileSync(analyzerPath, "utf8");
          const tapPattern = /var tap: Unmanaged<MTAudioProcessingTap>\?[\s\S]*?return tap\?\.takeRetainedValue\(\)\s*\}/;
          if (tapPattern.test(analyzer)) {
            analyzer = analyzer.replace(
              tapPattern,
          `#if compiler(>=6.2)
                  var tap: MTAudioProcessingTap?
                  let err = MTAudioProcessingTapCreate(kCFAllocatorDefault, &callbacks, kMTAudioProcessingTapCreationFlag_PreEffects, &tap)
                  if err == noErr {
                      return tap
                  }
                  #else
                  var tap: Unmanaged<MTAudioProcessingTap>?
                  let err = MTAudioProcessingTapCreate(kCFAllocatorDefault, &callbacks, kMTAudioProcessingTapCreationFlag_PreEffects, &tap)
                  if err == noErr {
                      return tap?.takeRetainedValue()
                  }
                  #endif`
            );
            console.log("✅ 已修复 AudioSpectrumAnalyzer.swift 中的 MTAudioProcessingTapCreate 类型签名");
          } else if (!analyzer.includes("#if compiler(>=6.2)")) {
            throw new Error("未在 AudioSpectrumAnalyzer.swift 中找到待修复的 MTAudioProcessingTapCreate 代码块");
          }
          // 同时修复 DSPSplitComplex 临时指针作用域与 vDSP_vsmul(&magnitudes, ..., &magnitudes, ...) 的 Swift 内存独占访问冲突 (overlapping accesses to 'magnitudes')
          const dspPattern = /var splitComplex = DSPSplitComplex\(realp: &realOut, imagp: &imagOut\)[\s\S]*?vDSP_vsmul\(&magnitudes, 1, &scale, &magnitudes, 1, vDSP_Length\(fftSize\)\)/;
          if (dspPattern.test(analyzer)) {
            analyzer = analyzer.replace(
              dspPattern,
          `var scale = 1.0 / Float(fftSize)
                  realOut.withUnsafeMutableBufferPointer { realPtr in
                      imagOut.withUnsafeMutableBufferPointer { imagPtr in
                          magnitudes.withUnsafeMutableBufferPointer { magPtr in
                              guard let realBase = realPtr.baseAddress,
                                    let imagBase = imagPtr.baseAddress,
                                    let magBase = magPtr.baseAddress else { return }
                              var splitComplex = DSPSplitComplex(realp: realBase, imagp: imagBase)
                              vDSP_zvabs(&splitComplex, 1, magBase, 1, vDSP_Length(fftSize))
                              vDSP_vsmul(magBase, 1, &scale, magBase, 1, vDSP_Length(fftSize))
                          }
                      }
                  }`
            );
            console.log("✅ 已修复 AudioSpectrumAnalyzer.swift 中的 DSPSplitComplex 指针作用域与 vDSP_vsmul 内存独占访问冲突");
          } else if (!analyzer.includes("vDSP_vsmul(magBase")) {
            throw new Error("未在 AudioSpectrumAnalyzer.swift 中找到待修复的 DSPSplitComplex / vDSP_vsmul 代码块");
          }
          fs.writeFileSync(analyzerPath, analyzer, "utf8");
          // 2. 修复 ExpoOrpheusModule.swift：
          // (a) 多语句 .set 闭包无法自动推断泛型参数 $0 的类型，需显式声明 (enabled: Bool) in
          const modulePath = "packages/orpheus/ios/ExpoOrpheusModule.swift";
          let mod = fs.readFileSync(modulePath, "utf8");
          const propPattern = /Property\("isSpectrumVisualizerEnabled"\)\s*\.get\s*\{\s*GeneralStorage\.shared\.isSpectrumVisualizerEnabled\s*\}\s*\.set\s*\{\s*GeneralStorage\.shared\.isSpectrumVisualizerEnabled = \$0\s*self\.sendEvent\("onSpectrumVisualizerEnabledChanged", \["enabled": \$0\]\)\s*\}/;
          if (propPattern.test(mod)) {
            mod = mod.replace(
              propPattern,
          `Property("isSpectrumVisualizerEnabled")
                      .get { GeneralStorage.shared.isSpectrumVisualizerEnabled }
                      .set { (enabled: Bool) in
                          GeneralStorage.shared.isSpectrumVisualizerEnabled = enabled
                          self.sendEvent("onSpectrumVisualizerEnabledChanged", ["enabled": enabled])
                      }`
            );
            console.log("✅ 已修复 ExpoOrpheusModule.swift 中的 isSpectrumVisualizerEnabled .set 闭包类型注解");
          } else if (!mod.includes("(enabled: Bool) in")) {
            throw new Error("未在 ExpoOrpheusModule.swift 中找到待修复的 isSpectrumVisualizerEnabled 代码块");
          }
          // (b) 修复 updateSpectrumData 中不存在的 TypedArray.getUnsafeMutablePointer 方法，
          // 改用 ExpoModulesCore 标准公开属性 destination.rawPointer.bindMemory(to:capacity:)
          const spectrumPattern = /Function\("updateSpectrumData"\)\s*\{\s*\(destination:\s*TypedArray\)\s*in[\s\S]*?fillSpectrumData\(destination:\s*ptr,\s*count:\s*count\)\s*\}\s*\}/;
          if (spectrumPattern.test(mod)) {
            mod = mod.replace(
              spectrumPattern,
          `Function("updateSpectrumData") { (destination: TypedArray) in
                  let count = destination.length
                  guard count > 0, destination.byteLength >= count * MemoryLayout<Float32>.stride else { return }
                  let ptr = destination.rawPointer.bindMemory(to: Float32.self, capacity: count)
                  AudioSpectrumAnalyzer.shared.fillSpectrumData(destination: ptr, count: count)
              }`
            );
            console.log("✅ 已修复 ExpoOrpheusModule.swift 中的 updateSpectrumData TypedArray 指针调用");
          } else if (!mod.includes("destination.rawPointer.bindMemory")) {
            throw new Error("未在 ExpoOrpheusModule.swift 中找到待修复的 updateSpectrumData 代码块");
          }
          // (c) 修复 iOS 端 setAllowSimultaneousPlayback 缺失导致的设置页闪退与后台混音失效
          if (!mod.includes("setAllowSimultaneousPlayback")) {
            const target = 'Function("setDownloadMaxParallelTasks") { (_: Int) in';
            const replacement = [
              'AsyncFunction("setAllowSimultaneousPlayback") { (enabled: Bool) in',
              '        OrpheusPlayerManager.shared.setAllowSimultaneousPlayback(enabled)',
              '    }',
              '',
              '    Function("setDownloadMaxParallelTasks") { (_: Int) in'
            ].join("\n");
            mod = mod.replace(target, replacement);
            console.log("✅ 已为 ExpoOrpheusModule.swift 补充 setAllowSimultaneousPlayback 方法");
          }
          fs.writeFileSync(modulePath, mod, "utf8");
          // (d) 为 OrpheusPlayerManager.swift 补充 addToEnd / addToNext 的 onQueueChanged 通知
          const playerMgrPath = "packages/orpheus/ios/OrpheusPlayerManager.swift";
          if (fs.existsSync(playerMgrPath)) {
            let playerMgr = fs.readFileSync(playerMgrPath, "utf8");
            // 在 addToEnd 和 addToNext 尾部触发 onQueueChanged，确保播放队列实时同步
            if (!playerMgr.includes("// queue sync patched")) {
              playerMgr = playerMgr.replace(
                "queueManager.insertNext(track: track)\n        saveState()",
                "queueManager.insertNext(track: track)\n        saveState()\n        onQueueChanged?() // queue sync patched"
              );
              const addToEndEndPattern = /saveState\(\)\s*\}\s*func setExecuteShuffleMode/;
              if (addToEndEndPattern.test(playerMgr)) {
                playerMgr = playerMgr.replace(
                  addToEndEndPattern,
                  "saveState()\n        }\n        onQueueChanged?()\n    }\n    \n    func setExecuteShuffleMode"
                );
              }
              fs.writeFileSync(playerMgrPath, playerMgr, "utf8");
              console.log("✅ 已为 OrpheusPlayerManager.swift 补充 addToEnd / addToNext 的 onQueueChanged 通知");
            }
          }
          // (e) 为 ExpoOrpheusModule.swift 补齐 iOS 端缺失的原生方法与属性（如 getLruCachedUris 等），防止运行时抛出 undefined is not a function
          if (!mod.includes("getLruCachedUris")) {
            // 补充缺失的属性：playbackResumeStrategy, isDesktopLyricsShown 等
            const propAnchor = 'Property("isSpectrumVisualizerEnabled")';
            const missingProps = [
              'Property("playbackResumeStrategy")',
              '            .get { 0 }',
              '            .set { (_: Int) in }',
              '',
              '        Property("isDesktopLyricsShown")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isDesktopLyricsLocked")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isStatusBarLyricsEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isCarLyricsEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("statusBarLyricsProvider")',
              '            .get { "lyricon" }',
              '            .set { (_: String) in }',
              '',
              '        Property("isSuperLyricApiEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isLyriconApiEnabled")',
              '            .get { false }',
              '            .set { (_: Bool) in }',
              '',
              '        Property("isSpectrumVisualizerEnabled")'
            ].join("\n");
            mod = mod.replace(propAnchor, missingProps);
            // 放宽 addToEnd 参数签名，避免参数转换失败
            const addToEndPattern = /AsyncFunction\("addToEnd"\)\s*\{\s*\(tracks:\s*\[Track\],\s*startFromId:\s*String\?,\s*clearQueue:\s*Bool\)\s*in/;
            if (addToEndPattern.test(mod)) {
              mod = mod.replace(
                addToEndPattern,
                'AsyncFunction("addToEnd") { (tracks: [Track], startFromId: String?, clearQueue: Bool?) in\n        let shouldClear = clearQueue ?? false'
              );
              mod = mod.replace('clearQueue: clearQueue)', 'clearQueue: shouldClear)');
            }
            // 补充缺失的方法：getLruCachedUris, clearPlaybackCache, downloadMissingCovers 等
            const funcAnchor = 'Function("updateSpectrumData")';
            const missingFuncs = [
              'Function("getLruCachedUris") { (uris: [String]) -> [String] in',
              '        return []',
              '    }',
              '',
              '    AsyncFunction("clearPlaybackCache") {',
              '    }',
              '',
              '    AsyncFunction("downloadMissingCovers") { () -> Int in',
              '        return 0',
              '    }',
              '',
              '    Function("getDownloadedCoverUri") { (_: String) -> String? in',
              '        return nil',
              '    }',
              '',
              '    AsyncFunction("exportDownloads") { (_: [String], _: String, _: String?, _: Bool, _: Bool, _: Bool) in',
              '    }',
              '',
              '    AsyncFunction("selectDirectory") { () -> String? in',
              '        return nil',
              '    }',
              '',
              '    AsyncFunction("isDirectoryPickerAvailable") { () -> Bool in',
              '        return false',
              '    }',
              '',
              '    Function("exportData") { () -> [String: Any] in',
              '        return ["playerQueue": [String: Any](), "loudness": [String: Double]() ]',
              '    }',
              '',
              '    Function("importData") { (_: [String: Any]) in',
              '    }',
              '',
              '    Function("updateSpectrumData")'
            ].join("\n");
            mod = mod.replace(funcAnchor, missingFuncs);
            fs.writeFileSync(modulePath, mod, "utf8");
            console.log("✅ 已为 ExpoOrpheusModule.swift 补全 getLruCachedUris 等缺失原生方法与属性");
          }
          // (f) 为 iOS 实现原生 BootSplashVideoView 视频播放组件与模块 (基于 AVPlayer / AVPlayerLayer)，兼容开屏与主题素材视频播放
          const bootSplashSwiftPath = "packages/orpheus/ios/BootSplashVideoView.swift";
          const bootSplashSwiftLines = [
            'import UIKit',
            'import AVFoundation',
            'import ExpoModulesCore',
            '',
            'public class BootSplashVideoView: ExpoView {',
            '    private var player: AVPlayer?',
            '    private var playerLayer: AVPlayerLayer?',
            '    private var endObserver: Any?',
            '    private var statusObserver: NSKeyValueObservation?',
            '',
            '    private var currentUri: String?',
            '    private var autoPlay: Bool = true',
            '    private var loop: Bool = false',
            '    private var muted: Bool = true',
            '    private var contentFit: String = "cover"',
            '',
            '    public let onPlaybackEnd = EventDispatcher()',
            '    public let onPlaybackError = EventDispatcher()',
            '',
            '    public required init(appContext: AppContext? = nil) {',
            '        super.init(appContext: appContext)',
            '        backgroundColor = .clear',
            '    }',
            '',
            '    public override func layoutSubviews() {',
            '        super.layoutSubviews()',
            '        CATransaction.begin()',
            '        CATransaction.setDisableActions(true)',
            '        playerLayer?.frame = bounds',
            '        CATransaction.commit()',
            '    }',
            '',
            '    private func parseUrl(from uriString: String?) -> URL? {',
            '        guard let uri = uriString?.trimmingCharacters(in: .whitespacesAndNewlines), !uri.isEmpty else {',
            '            return nil',
            '        }',
            '        if uri.hasPrefix("file://") {',
            '            return URL(string: uri)',
            '        }',
            '        if uri.hasPrefix("http://") || uri.hasPrefix("https://") {',
            '            return URL(string: uri)',
            '        }',
            '        if uri.hasPrefix("/") {',
            '            return URL(fileURLWithPath: uri)',
            '        }',
            '        let filename = (uri as NSString).lastPathComponent',
            '        let name = (filename as NSString).deletingPathExtension',
            '        let ext = (filename as NSString).pathExtension',
            '        if let bundleUrl = Bundle.main.url(forResource: name, withExtension: ext.isEmpty ? nil : ext) {',
            '            return bundleUrl',
            '        }',
            '        return URL(fileURLWithPath: uri)',
            '    }',
            '',
            '    private func applyChanges() {',
            '        guard let uri = currentUri, let url = parseUrl(from: uri) else {',
            '            cleanup()',
            '            return',
            '        }',
            '        cleanup()',
            '        let asset = AVURLAsset(url: url)',
            '        let item = AVPlayerItem(asset: asset)',
            '        let newPlayer = AVPlayer(playerItem: item)',
            '        newPlayer.isMuted = self.muted',
            '        if #available(iOS 10.0, *) {',
            '            newPlayer.automaticallyWaitsToMinimizeStalling = false',
            '        }',
            '        newPlayer.actionAtItemEnd = .none',
            '        let layer = AVPlayerLayer(player: newPlayer)',
            '        layer.videoGravity = (contentFit == "contain") ? .resizeAspect : .resizeAspectFill',
            '        layer.frame = bounds',
            '        self.layer.addSublayer(layer)',
            '        self.player = newPlayer',
            '        self.playerLayer = layer',
            '        endObserver = NotificationCenter.default.addObserver(',
            '            forName: .AVPlayerItemDidPlayToEndTime,',
            '            object: item,',
            '            queue: .main',
            '        ) { [weak self] _ in',
            '            guard let self = self else { return }',
            '            if self.loop {',
            '                self.player?.seek(to: .zero)',
            '                self.player?.play()',
            '            } else {',
            '                self.onPlaybackEnd([:])',
            '            }',
            '        }',
            '        statusObserver = item.observe(\\.status, options: [.new]) { [weak self] playerItem, _ in',
            '            guard let self = self else { return }',
            '            if playerItem.status == .failed {',
            '                let errorMsg = playerItem.error?.localizedDescription ?? "播放失败"',
            '                self.onPlaybackError(["message": errorMsg])',
            '            }',
            '        }',
            '        if autoPlay {',
            '            newPlayer.play()',
            '        }',
            '    }',
            '',
            '    public func setSource(_ uri: String?) {',
            '        if currentUri != uri {',
            '            currentUri = uri',
            '            applyChanges()',
            '        }',
            '    }',
            '    public func setAutoPlay(_ play: Bool) {',
            '        autoPlay = play',
            '        if play { player?.play() }',
            '    }',
